<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>📚 My Learning Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ── TOP BAR ── */
        .topbar {
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-wrap: nowrap;
        }

        .topbar h1 {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
        }

        .topbar .home-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: none;
        }

        .topbar .home-btn:hover { background: rgba(255,255,255,0.3); }
        .topbar .home-btn.visible { display: inline-block; }

        .topbar .breadcrumb {
            font-size: 14px;
            opacity: 0.9;
            display: none;
        }

        .topbar .breadcrumb.visible { display: inline; }

        .topbar .topbar-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-block;
        }

        .topbar .topbar-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .topbar .collapse-btn { margin-right: 6px; }
        .topbar .expand-btn { margin-right: 0; }

        /* ── HOME VIEW ── */
        .home-view {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .home-view.hidden { display: none; }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #2563eb;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s;
        }

        .section-title:hover { opacity: 0.8; }

        .section-title span { font-size: 24px; }

        .section-title .chevron {
            margin-left: auto;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .section-title.collapsed .chevron {
            transform: rotate(-90deg);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            overflow: hidden;
        }

        .cards-grid.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin-bottom: 8px;
        }

        .card {
            background: white;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .card:hover {
            border-color: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
        }

        .card-icon {
            font-size: 32px;
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            background: #eff6ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-info { flex: 1; min-width: 0; }

        .card-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            color: #1a1a1a;
            word-wrap: break-word;
        }

        .card-desc {
            font-size: 13px;
            color: #888;
        }

        .card-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 6px;
        }

        .badge-blue { background: #dbeafe; color: #1d4ed8; }
        .badge-green { background: #dcfce7; color: #15803d; }
        .badge-purple { background: #f3e8ff; color: #7c3aed; }
        .badge-orange { background: #ffedd5; color: #c2410c; }

        /* ── CONTENT VIEW (iframe) ── */
        .content-view {
            display: none;
            width: 100%;
            height: calc(100vh - 52px);
        }

        .content-view.active {
            display: block;
        }

        .content-view iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── SEARCH ── */
        .search-bar {
            margin-bottom: 24px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* ── STATS ── */
        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .stat {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 14px 20px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #2563eb;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: 1fr; }
            .topbar { padding: 8px 12px; gap: 8px; }
            .topbar h1 { font-size: 14px; }
            .stats-bar { flex-direction: column; }
            .topbar .topbar-btn { padding: 4px 8px; font-size: 14px; }
        }
    </style>
</head>
<body>

        <!-- TOP BAR -->
        <div class="topbar">
            <button class="home-btn" id="homeBtn" onclick="goHome()">← Home</button>
            <h1 id="pageTitle">📚 My Learning Hub</h1>
            <span class="breadcrumb" id="breadcrumb"></span>
            <button class="topbar-btn collapse-btn" id="collapseBtn" onclick="collapseAllSections()" title="Collapse All Sections">📁</button>
            <button class="topbar-btn expand-btn" id="expandBtn" onclick="expandAllSections()" title="Expand All Sections">📂</button>
        </div>

    <!-- HOME VIEW -->
    <div class="home-view" id="homeView">

        <!-- SEARCH -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search topics...">
        </div>


        <!-- STATS -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Topics</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="resourceCount">0</div>
                <div class="stat-label">Cheat Sheets</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="questionCount">0</div>
                <div class="stat-label">Q&A Pages</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="techCount">0</div>
                <div class="stat-label">Technology</div>
            </div>
        </div>

        <!-- QUESTIONS SECTION -->
        <div class="section-title collapsed" onclick="toggleSection(this)"><span>🎯</span> Interview Q&A <span class="chevron">▼</span></div>
        <div class="cards-grid collapsed" id="questionsGrid"></div>

        <!-- PRACTICE PROBLEMS SECTION -->
        <div class="section-title collapsed" onclick="toggleSection(this)"><span>🔧</span> Practice Problems <span class="chevron">▼</span></div>
        <div class="cards-grid collapsed" id="problemsGrid"></div>

        <!-- TECHNOLOGY SECTION -->
        <div class="section-title collapsed" onclick="toggleSection(this)"><span>💻</span> Technology Deep Dive <span class="chevron">▼</span></div>
        <div class="cards-grid collapsed" id="techGrid"></div>

        <!-- KEEP NOTES SECTION -->
        <div class="section-title collapsed" onclick="toggleSection(this)"><span>📌</span> Keep Notes <span class="chevron">▼</span></div>
        <div class="cards-grid collapsed" id="keepNotesGrid"></div>

        <!-- RESOURCES SECTION -->
        <div class="section-title collapsed" onclick="toggleSection(this)"><span>📖</span> Cheat Sheets & Notes <span class="chevron">▼</span></div>
        <div class="cards-grid collapsed" id="resourcesGrid"></div>

        <!-- VIEW CHARTS SECTION -->
        <div class="section-title collapsed" onclick="toggleSection(this)"><span>📊</span> View Charts <span class="chevron">▼</span></div>
        <div class="cards-grid collapsed" id="chartsGrid"></div>

        <div class="footer">📚 My Learning Hub · Keep adding topics!</div>
    </div>

    <!-- CONTENT VIEW (SPA iframe) -->
    <div class="content-view" id="contentView">
        <iframe id="contentFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <script>
        // ── TOPIC DATA ──
        const questions = [
            {

                badge: "badge-blue",
                badgeText: "IMPROVED"

            {

            {

            {

                title: "API Layer Design Interview (Two-Panel)",
                desc: "7 questions: architecture (REST/GraphQL/gRPC), auth methods, request flow, versioning, optimization, async/sync/real-time, error debugging",
                icon: "🔌",
                badge: "badge-blue",
                badgeText: "7 QUESTIONS"
            },
            {
                file: "../Questions/db_layer_interview.html",
                title: "Database Layer Interview - Progressive Q&A",
                desc: "7 rounds: Replication, failover, scaling reads/writes, sharding & consistency, connection pooling, performance debugging, startup MVP design",
                icon: "🗄️",
                badge: "badge-green",

            }
        ];

        const keepNotes = [
            {
                file: "../Questions/system_design_concepts.html",

            },
            {

            },
            {
                file: "../Questions/http_rest_concepts.html",
                title: "HTTP & REST Concepts",
                desc: "REST Principles, Status Codes, Caching, Pagination, Versioning, Connection Pooling",
                icon: "🌐",
                badge: "badge-orange",
                badgeText: "6 TOPICS"
            },
            {
                file: "../Questions/microservices_patterns.html",
                title: "Microservices Patterns Deep Dive",
                desc: "Resilience, Circuit Breaker, Bulkhead, Saga, CQRS, Service Mesh, Discovery, Data Mgmt",
                icon: "🔗",
                badge: "badge-blue",
                badgeText: "10 TOPICS"
            },
            {
                file: "../Questions/networking_concepts.html",
                title: "Networking & Load Balancing",
                desc: "ALB vs NLB vs Gateway, DNS & Geo Routing, Private IPs, Multi-Region Architecture",
                icon: "🌍",
                badge: "badge-green",
                badgeText: "3 TOPICS"
            },
            {
                file: "../Questions/security_jwt.html",
                title: "Security — JWT Authentication",
                desc: "Token format, creation, validation, stateless auth, best practices",
                icon: "🔐",
                badge: "badge-orange",
                badgeText: "8 Q&A"
            }
        ];

        const technology = [
            {
                file: "../Questions/Microservices.html",
                title: "Microservices Deep Dive",
                desc: "12 topics: Architecture, Communication, API Gateway, Resilience, Data, Events, Security, Observability, Deployment, Patterns",
                icon: "🔗",
                badge: "badge-green",
                badgeText: "12 TOPICS"
            },
            {
                file: "../Resource/advanced_spring_spring_boot_cheat_sheet.html",
                title: "Advanced Spring & Spring Boot",
                desc: "Spring framework cheat sheet",
                icon: "🍃",
                badge: "badge-blue",
                badgeText: "SPRING"
            },
            {
                file: "../Resource/spring_security_cheat_sheet.html",
                title: "Spring Security Cheat Sheet",
                desc: "Auth, JWT, OAuth2, CORS, CSRF",
                icon: "🔐",
                badge: "badge-orange",
                badgeText: "SECURITY"
            },
            {
                file: "../Questions/JPA.html",
                title: "JPA Deep Dive",
                desc: "JPA, Hibernate, ORM, entities, relationships, queries",
                icon: "🗄️",
                badge: "badge-purple",
                badgeText: "JPA"
            }
        ];

        const resources = [
            {
                file: "../Resource/Architecture_Complete_CheatSheet.html",
                title: "Architecture Complete Cheat Sheet",
                desc: "Full architecture reference",
                icon: "🏛️"
            },
            {
                file: "../Resource/Design_Concept_COMPLETE_No_Details_Missed.html",
                title: "Design Concepts Complete",
                desc: "All design concepts, no details missed",
                icon: "📐"
            },
            {
                file: "../Resource/Design_Concept_Complete_Hierarchical_Cheat_Sheet.html",
                title: "Design Concepts Hierarchical",
                desc: "Hierarchical cheat sheet of design concepts",
                icon: "🗂️"
            },
            {
                file: "../Resource/Design_Pattern.html",
                title: "Design Patterns",
                desc: "Gang of Four design patterns",

            },
            {
                file: "../Resource/Design_Patterns_Complete_Hierarchical_Notes.html",
                title: "Design Patterns Hierarchical Notes",
                desc: "Complete hierarchical pattern notes",
                icon: "📊"
            },
            {
                file: "../Resource/Design_Patterns_Learning_Flow(3).html",
                title: "Design Patterns Learning Flow",
                desc: "Step-by-step learning path",
                icon: "🔄"
            },
            {
                file: "../Resource/Hibernate_JPA_learning_flow.html",
                title: "Hibernate & JPA Learning Flow",
                desc: "ORM, entities, queries, caching",
                icon: "🗄️"
            },
            {
                file: "../Resource/Oops_DesignPattern.html",
                title: "OOPs & Design Patterns",
                desc: "Object-oriented principles + patterns",
                icon: "🧱"
            },
            {
                file: "../Resource/SystemDesign_20_Questions_Interactive_CheatSheet.html",
                title: "System Design 20 Questions",
                desc: "Interactive cheat sheet",
                icon: "📝"
            },
            {
                file: "../Resource/System_Design_Byte_by_Go_Complete_Architect_Notes.html",
                title: "System Design Architect Notes",
                desc: "Byte-by-byte complete notes",
                icon: "📓"
            },
            {
                file: "../Resource/microservices_learning_cheat_sheet.html",
                title: "Microservices Cheat Sheet",
                desc: "Microservices architecture patterns",
                icon: "🔗"
            }
        ];

        const charts = [
            {
                file: "../Questions/ByteByGo.html",
                title: "ByteByGo — System Design Visual Charts",
                desc: "12 System Design Concepts with visual diagrams: Load Balancing, Caching, CDN, Sharding, Replication, Consistent Hashing, Message Queue, Rate Limiting, Idempotency, CAP Theorem, Eventual Consistency, Backpressure",
                icon: "📊",
                badge: "badge-blue",
                badgeText: "12 CONCEPTS"
            }
        ];

        // ── RENDER CARDS ──
        function renderCards(items, containerId, badgeDefault) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-title', item.title.toLowerCase());
                card.setAttribute('data-desc', (item.desc || '').toLowerCase());
                card.onclick = () => openContent(item.file, item.title);

                let badgeHtml = '';
                if (item.badge && item.badgeText) {
                    badgeHtml = `<div class="card-badge ${item.badge}">${item.badgeText}</div>`;
                } else if (badgeDefault) {
                    badgeHtml = `<div class="card-badge ${badgeDefault}">CHEAT SHEET</div>`;
                }

                card.innerHTML = `
                    <div class="card-icon">${item.icon}</div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc || ''}</div>
                        ${badgeHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ── OPEN CONTENT (SPA) ──
        function openContent(file, title) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('contentView').classList.add('active');
            document.getElementById('contentFrame').src = file;
            document.getElementById('homeBtn').classList.add('visible');
            document.getElementById('breadcrumb').classList.add('visible');
            document.getElementById('breadcrumb').textContent = title;
            document.getElementById('pageTitle').textContent = title;
            window.scrollTo(0, 0);
        }

        // ── GO HOME ──
        function goHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('contentView').classList.remove('active');
            document.getElementById('contentFrame').src = '';
            document.getElementById('homeBtn').classList.remove('visible');
            document.getElementById('breadcrumb').classList.remove('visible');
            document.getElementById('pageTitle').textContent = '📚 My Learning Hub';
        }

        // ── TOGGLE SECTION ──
        function toggleSection(titleEl) {
            titleEl.classList.toggle('collapsed');
            const grid = titleEl.nextElementSibling;
            grid.classList.toggle('collapsed');
        }

        // ── COLLAPSE ALL SECTIONS ──
        function collapseAllSections() {
            document.querySelectorAll('.section-title').forEach(title => {
                title.classList.add('collapsed');
                title.nextElementSibling.classList.add('collapsed');
            });
        }

        // ── EXPAND ALL SECTIONS ──
        function expandAllSections() {
            document.querySelectorAll('.section-title').forEach(title => {
                title.classList.remove('collapsed');
                title.nextElementSibling.classList.remove('collapsed');
            });
        }

        // ── SEARCH ──
        document.getElementById('searchInput').addEventListener('input', function () {
            const q = this.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.getAttribute('data-title') || '';
                const desc = card.getAttribute('data-desc') || '';
                card.style.display = (title.includes(q) || desc.includes(q)) ? 'flex' : 'none';
            });
        });

        // ── KEYBOARD: ESC to go home ──
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') goHome();
        });

        // ── INIT ──
        renderCards(questions, 'questionsGrid');
        renderCards(problems, 'problemsGrid', 'badge-purple');
        renderCards(technology, 'techGrid');
        renderCards(keepNotes, 'keepNotesGrid');
        renderCards(resources, 'resourcesGrid', 'badge-purple');
        renderCards(charts, 'chartsGrid', 'badge-blue');

        document.getElementById('totalCount').textContent = questions.length + problems.length + technology.length + keepNotes.length + resources.length + charts.length;
        document.getElementById('resourceCount').textContent = resources.length;
        document.getElementById('questionCount').textContent = questions.length;
        document.getElementById('techCount').textContent = technology.length;
    </script>
</body>
</html>
