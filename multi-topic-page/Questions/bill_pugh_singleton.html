    <style>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>👤 Bill Pugh Singleton</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_singleton_immutable_index.html" class="back-link">← Back to Singleton & Immutable</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "What is Bill Pugh Singleton?",
                content: `<div class="content-header"><h2>1. What is Bill Pugh Singleton?</h2><p>Best thread-safe singleton pattern</p></div>
                <div class="content-body"><p><strong>Definition:</strong> Lazy-loaded, thread-safe Singleton using a static inner class.</p>
                <p><strong>Named After:</strong> Bill Pugh, computer science professor who introduced this approach</p>
                <p><strong>Key Advantages:</strong></p><ul><li>No synchronization blocks (no lock overhead)</li><li>No volatile keywords (simpler)</li><li>Thread-safe guaranteed by JVM class loading</li><li>Lazy initialization (instance created only when needed)</li><li>Elegant and simple implementation</li></ul>
                <div class="tip">This is considered the best singleton pattern in modern Java!</div></div>`
            },
            {
                id: 2,
                title: "Implementation",
                content: `<div class="content-header"><h2>2. Implementation</h2><p>How to code the pattern</p></div>
                <div class="content-body"><div class="code-block">public class Singleton implements Serializable, Cloneable {
    private Singleton() {}  // Private constructor

    private static class Holder {
        private static final Singleton INSTANCE = new Singleton();
    }

    public static Singleton getInstance() {
        return Holder.INSTANCE;  // Class loading triggers init
    }

    // Handle deserialization
    protected Object readResolve() {
        return getInstance();
    }

    // Handle cloning
    @Override
    protected Object clone() throws CloneNotSupportedException {
        return getInstance();
    }
}</div></div>`
            },
            {
                id: 3,
                title: "Why It's Thread-Safe",
                content: `<div class="content-header"><h2>3. Why It's Thread-Safe</h2><p>JVM guarantees class loading safety</p></div>
                <div class="content-body"><p><strong>Process When Multiple Threads Call getInstance():</strong></p>
                <ol><li>Both threads reach: return Holder.INSTANCE;</li><li>JVM begins loading Holder class (only once)</li><li>Thread A picked by JVM to load Holder</li><li>Thread B waits until Holder fully initialized</li><li>INSTANCE static final field initialized</li><li>Thread B resumes, gets already-created instance</li></ol>
                <div class="tip">JVM guarantees serial class initialization - only one thread can initialize a class at a time.</div>
                <p><strong>Official Backing:</strong> Java Language Specification guarantees this behavior</p></div>`
            },
            {
                id: 4,
                title: "Problem with Other Patterns",
                content: `<div class="content-header"><h2>4. Problem with Other Patterns</h2><p>Why Bill Pugh is better</p></div>
                <div class="content-body"><p><strong>❌ Eager Initialization:</strong> Instance created immediately (wastes memory)</p>
                <p><strong>❌ Lazy + Not Thread-Safe:</strong> Can create multiple instances</p>
                <div class="code-block">// NOT thread-safe
public class BadSingleton {
    private static BadSingleton instance;
    public static BadSingleton getInstance() {
        if (instance == null) {
            instance = new BadSingleton();  // Race condition!
        }
        return instance;
    }
}</div>
                <p><strong>❌ Synchronized Method:</strong> Every call is synchronized (slow)</p>
                <p><strong>❌ Double-Checked Locking:</strong> Complex, needs volatile</p>
                <p><strong>✅ Bill Pugh:</strong> Simple, thread-safe, NO locks, lazy-loaded!</p></div>`
            },
            {
                id: 5,
                title: "Serialization & Cloning",
                content: `<div class="content-header"><h2>5. Handling Serialization & Cloning</h2><p>Protecting singleton property</p></div>
                <div class="content-body"><p><strong>Problem:</strong> Serialization/deserialization could create new instances</p>
                <p><strong>Solution:</strong> Override readResolve() and clone()</p>
                <div class="code-block">// readResolve() called during deserialization
protected Object readResolve() {
    return getInstance();  // Return existing instance
}

// clone() called when clone is attempted
@Override
protected Object clone() throws CloneNotSupportedException {
    return getInstance();  // Return existing instance
}</div>
                <div class="tip">These methods ensure the singleton property is maintained even after serialization/cloning.</div></div>`
            },
            {
                id: 6,
                title: "Interview Key Points",
                content: `<div class="content-header"><h2>6. Interview Key Points</h2><p>Important facts to remember</p></div>
                <div class="content-body"><p><strong>Key Facts:</strong></p><ul><li>Static inner class Holder holds instance</li><li>getInstance() returns Holder.INSTANCE</li><li>JVM class loading ensures thread safety</li><li>Lazy loaded (instance created on first access)</li><li>No synchronization needed</li><li>No volatile needed</li><li>Handles serialization/cloning properly</li></ul>
                <p><strong>Comparison Summary:</strong></p><ul><li>vs Eager: Lazy loads (memory efficient)</li><li>vs Synchronized: No locks (faster)</li><li>vs DCL: Simpler code, guaranteed safe</li></ul></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
