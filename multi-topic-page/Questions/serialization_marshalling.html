<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Serialization & Marshalling - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.4em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>💾 Serialization</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_master_index.html" class="back-link">← Back to Master Index</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "What is Serialization?",
                content: `<div class="content-header"><h2>1. What is Serialization?</h2><p>Converting objects to byte streams</p></div>
                <div class="content-body"><p><strong>Serialization:</strong> Process of converting an object into a byte stream</p>
                <p><strong>Deserialization:</strong> Process of reconstructing an object from a byte stream</p>
                <p><strong>Why use it?</strong></p><ul><li>Saving objects to disk/file</li><li>Transmitting objects over network</li><li>Session persistence in web apps</li><li>Caching objects</li></ul>
                <div class="code-block">Object -> Serialization -> Byte Stream
Byte Stream -> Deserialization -> Object</div></div>`
            },
            {
                id: 2,
                title: "Making Objects Serializable",
                content: `<div class="content-header"><h2>2. Making Objects Serializable</h2><p>How to enable serialization</p></div>
                <div class="content-body"><p><strong>Implement Serializable interface:</strong></p>
                <div class="code-block">public class Person implements Serializable {
    private static final long serialVersionUID = 1L;

    private String name;
    private int age;
    private transient String password;  // Not serialized
}</div>
                <p><strong>serialVersionUID:</strong> Version identifier for class compatibility</p>
                <p><strong>transient keyword:</strong> Excludes field from serialization</p></div>`
            },
            {
                id: 3,
                title: "Serialization Process",
                content: `<div class="content-header"><h2>3. Serialization Process</h2><p>How serialization works</p></div>
                <div class="content-body"><div class="code-block">// Serialization
Person person = new Person("John", 25);
FileOutputStream fos = new FileOutputStream("person.dat");
ObjectOutputStream oos = new ObjectOutputStream(fos);
oos.writeObject(person);  // Serialize
oos.close();
fos.close();</div>
                <div class="code-block">// Deserialization
FileInputStream fis = new FileInputStream("person.dat");
ObjectInputStream ois = new ObjectInputStream(fis);
Person person = (Person) ois.readObject();  // Deserialize
ois.close();
fis.close();</div></div>`
            },
            {
                id: 4,
                title: "Marshalling vs Serialization",
                content: `<div class="content-header"><h2>4. Marshalling vs Serialization</h2><p>Understanding the difference</p></div>
                <div class="content-body"><p><strong>Serialization:</strong></p><ul><li>Java-specific format</li><li>Binary byte stream</li><li>Used for Java object persistence</li><li>Example: ObjectOutputStream</li></ul>
                <p><strong>Marshalling:</strong></p><ul><li>Language-independent format</li><li>Uses standard formats like XML, JSON, Protocol Buffers</li><li>Used for inter-language/inter-system communication</li><li>Example: JSON marshalling in REST APIs</li></ul>
                <div class="code-block">// Marshalling to JSON
Person person = new Person("John", 25);
String json = objectMapper.writeValueAsString(person);
// Result: {"name":"John","age":25}</div></div>`
            },
            {
                id: 5,
                title: "serialVersionUID",
                content: `<div class="content-header"><h2>5. serialVersionUID</h2><p>Ensuring compatibility across versions</p></div>
                <div class="content-body"><p><strong>Purpose:</strong> Identifies class version for deserialization</p>
                <p><strong>When versions don't match:</strong> InvalidClassException</p>
                <div class="code-block">// Version 1
public class Person implements Serializable {
    private static final long serialVersionUID = 1L;
    private String name;
}

// Version 2 (added age field)
public class Person implements Serializable {
    private static final long serialVersionUID = 1L;  // Still 1L
    private String name;
    private int age;  // New field
}</div>
                <p><strong>Best Practice:</strong> Always include serialVersionUID for Serializable classes</p></div>`
            },
            {
                id: 6,
                title: "Custom Serialization",
                content: `<div class="content-header"><h2>6. Custom Serialization</h2><p>Controlling serialization behavior</p></div>
                <div class="content-body"><p><strong>writeObject() and readObject():</strong> Custom serialization methods</p>
                <div class="code-block">public class Person implements Serializable {
    private String name;
    private transient String password;

    private void writeObject(ObjectOutputStream oos)
            throws IOException {
        oos.defaultWriteObject();
        oos.writeObject(encryptPassword(password));
    }

    private void readObject(ObjectInputStream ois)
            throws IOException, ClassNotFoundException {
        ois.defaultReadObject();
        password = decryptPassword((String) ois.readObject());
    }
}</div></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
