<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Static - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.4em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul, .content-body ol { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; white-space: pre-wrap; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>🔑 Static</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_keywords_index.html" class="back-link">← Back to Keywords</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "Static Variables",
                content: `<div class="content-header"><h2>1. Static Variables</h2><p>Class-level variable shared by all objects</p></div>
                <div class="content-body">
                <p><strong>Key Characteristics:</strong></p>
                <ol><li>Static variables belong to the class, not to individual objects.</li>
                <li>Only one copy of a static variable is created, regardless of how many objects are created.</li>
                <li>Memory is allocated only once in the Method Area (Class Area/Metaspace) when the class is loaded.</li>
                <li>Any modification made by one object is visible to all other objects.</li></ol>
                <p><strong>Common Uses:</strong></p>
                <ul><li>Counters</li><li>Constants (usually public static final)</li><li>Configuration values</li><li>Shared resources</li></ul>
                <p><strong>Example:</strong></p>
                <div class="code-block">class Employee {
    static String company = "Accenture";
    static int employeeCount = 0;
}</div>
                <p><strong>Initialization:</strong> Static variables are initialized when the class is loaded. They get default values if not explicitly initialized (0 for int, null for objects, etc.)</p>
                <p><strong>Memory Location:</strong> Method Area (Metaspace), NOT Heap Memory</p></div>`
            },
            {
                id: 2,
                title: "Static Methods",
                content: `<div class="content-header"><h2>2. Static Methods</h2><p>Methods belonging to the class, not instances</p></div>
                <div class="content-body">
                <p><strong>Key Characteristics:</strong></p>
                <ol><li>Static methods belong to the class</li><li>They can be called without creating an object - Math.sqrt(25)</li><li>Can directly access: Static variables and other static methods</li><li>Cannot directly access non-static (instance) members because instance members belong to objects</li></ol>
                <p><strong>Restrictions:</strong></p>
                <ul><li>Cannot use 'this' keyword</li><li>Cannot use 'super' keyword</li><li>Method Overloading is allowed</li><li>Method Overriding is NOT possible in true sense</li></ul>
                <p><strong>Method Hiding (Not Overriding):</strong> If child class defines static method with same signature as parent, it's called Method Hiding, not overriding</p>
                <div class="code-block">class Parent {
    static void show() {}
}

class Child extends Parent {
    static void show() {}  // Method Hiding, not overriding
}</div></div>`
            },
            {
                id: 3,
                title: "Static Blocks",
                content: `<div class="content-header"><h2>3. Static Blocks (Static Initializers)</h2><p>One-time initialization when class loads</p></div>
                <div class="content-body">
                <p><strong>Key Characteristics:</strong></p>
                <ol><li>Executes only once during class loading</li><li>Executes BEFORE: main() method, Constructor, Object creation</li><li>Mainly used for initialization of static variables</li><li>Multiple static blocks are allowed</li><li>Static blocks execute in the order they appear in the class</li><li>Executes only once even if multiple objects are created</li></ol>
                <p><strong>Example - Execution Order:</strong></p>
                <div class="code-block">class Demo {
    static {
        System.out.println("First Block");
    }
    static {
        System.out.println("Second Block");
    }
    public static void main(String args[]) {
        System.out.println("Main Method");
    }
}
// Output:
// First Block
// Second Block
// Main Method</div>
                <p><strong>Exception Handling:</strong> If an exception occurs inside a static block, class loading fails and JVM throws ExceptionInInitializerError.</p></div>`
            },
            {
                id: 4,
                title: "Static Nested Classes",
                content: `<div class="content-header"><h2>4. Static Nested Classes</h2><p>Static classes nested within another class</p></div>
                <div class="content-body">
                <p><strong>Definition & Key Features:</strong></p>
                <ul><li>A static nested class is declared using the static keyword inside another class</li><li>Does not require an object of the outer class</li><li>Can access static members of outer class directly</li><li>Can access non-static members only through an outer class object</li></ul>
                <p><strong>Important Distinction:</strong> Static nested class vs Inner (non-static) nested class</p>
                <div class="code-block">class Outer {
    static int x = 10;  // static variable
    int y = 20;         // instance variable

    static class Inner {
        void display() {
            System.out.println(x);      // ✅ Can access static x directly
            // System.out.println(y);   // ❌ Cannot access instance y directly
        }
    }
}

// Usage:
Outer.Inner obj = new Outer.Inner();
obj.display();</div></div>`
            },
            {
                id: 5,
                title: "Static Import",
                content: `<div class="content-header"><h2>5. Static Import</h2><p>Access static members without class name (Java 5+)</p></div>
                <div class="content-body">
                <p><strong>Key Facts:</strong></p>
                <ol><li>Introduced in Java 5</li><li>Allows accessing static members without using the class name</li></ol>
                <p><strong>Without Static Import:</strong></p>
                <div class="code-block">Math.sqrt(25);
Math.PI;
System.out.println();</div>
                <p><strong>With Static Import:</strong></p>
                <div class="code-block">import static java.lang.Math.*;
import static java.lang.System.out;

sqrt(25);
PI;
out.println();</div></div>`
            },
            {
                id: 6,
                title: "Execution Order & Memory",
                content: `<div class="content-header"><h2>6. Execution Order & Memory Locations</h2><p>Complete lifecycle with memory storage</p></div>
                <div class="content-body">
                <p><strong>Order of Execution:</strong></p>
                <ol><li>Static Variables Initialization</li><li>Static Blocks Execution</li><li>main() Method Execution</li><li>Object Creation</li><li>Instance Variables Initialization</li><li>Instance Initialization Block</li><li>Constructor Execution</li></ol>
                <p><strong>Memory Locations:</strong></p>
                <ul><li>Static Variables → Method Area (Class Area / Metaspace)</li><li>Instance Variables → Heap Memory</li><li>Local Variables → Stack Memory</li></ul></div>`
            },
            {
                id: 7,
                title: "Important Rules - Q&A",
                content: `<div class="content-header"><h2>7. Important Rules & Interview Questions</h2><p>Common questions and their answers</p></div>
                <div class="content-body">
                <p><strong>Q1: Can constructor be static?</strong></p>
                <p>❌ No. Constructors are invoked when objects are created, whereas static belongs to the class.</p>
                <p><strong>Q2: Can local variables be static?</strong></p>
                <p>❌ No. Static is applicable only to class members (fields, methods, nested classes).</p>
                <p><strong>Q3: Can static methods access instance variables?</strong></p>
                <p>❌ No. They require an object reference which static methods don't have.</p>
                <p><strong>Q4: Can instance methods access static members?</strong></p>
                <p>✅ Yes. Instance methods can access both static and non-static members.</p>
                <p><strong>Q5: Can static variables be inherited?</strong></p>
                <p>✅ Yes. They are inherited but shared among all objects of parent and child classes.</p>
                <p><strong>Q6: Can static methods be overridden?</strong></p>
                <p>❌ No. They are hidden, not overridden. It's called Method Hiding.</p>
                <p><strong>Q7: Can main() method be non-static?</strong></p>
                <p>❌ No. JVM calls main() before creating any object, so it must be static: public static void main(String args[])</p>
                <p><strong>Q8: Can we access static members using an object?</strong></p>
                <p>✅ Yes, but NOT RECOMMENDED. Example: Student s = new Student(); s.college; → WRONG! Should be: Student.college;</p></div>`
            },
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
