<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java JVM Memory Map - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.4em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>🧠 JVM Memory</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area"><div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div></div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "JVM Memory Structure",
                content: `<div class="content-header"><h2>1. JVM Memory Structure</h2><p>How JVM organizes memory</p></div>
                <div class="content-body"><div class="code-block">JVM Memory
├── Heap (Shared)
├── Stack (Per Thread)
├── Method Area / Metaspace
├── Program Counter (PC) Register
└── Native Method Stack</div>
                <p><strong>Shared across threads:</strong></p><ul><li>Heap - Objects are stored</li><li>Method Area/Metaspace - Class structures</li></ul>
                <p><strong>Per thread:</strong></p><ul><li>Stack - Primitive values, method calls</li><li>Program Counter - Currently executing instruction</li><li>Native Method Stack - Native code</li></ul></div>`
            },
            {
                id: 2,
                title: "Heap Memory",
                content: `<div class="content-header"><h2>2. Heap Memory</h2><p>Where objects are stored</p></div>
                <div class="content-body"><p><strong>Characteristics:</strong></p><ul><li>Shared by all threads</li><li>Objects are stored here</li><li>Garbage collection happens here</li><li>Smaller heap = OutOfMemoryError sooner</li><li>Larger heap = More memory usage</li></ul>
                <p><strong>Heap Regions:</strong></p><div class="code-block">Heap
├── Young Generation (Eden, Survivor S0, Survivor S1)
└── Old Generation

Eden -> Survivor -> Old Generation (Object lifespan)</div>
                <p><strong>GC in Young Gen:</strong> Minor GC (fast)</p>
                <p><strong>GC in Old Gen:</strong> Major GC (slow)</p></div>`
            },
            {
                id: 3,
                title: "Stack Memory",
                content: `<div class="content-header"><h2>3. Stack Memory</h2><p>Per-thread local memory</p></div>
                <div class="content-body"><p><strong>Characteristics:</strong></p><ul><li>Separate stack per thread</li><li>Stores primitives and references</li><li>LIFO (Last In First Out)</li><li>Thread-safe (no sharing)</li><li>Fixed size - StackOverflowError if exceeded</li></ul>
                <div class="code-block">public void method1() {
    int age = 25;           // Stack
    Person person = new Person();  // Reference on stack, object on heap
    method2();              // New stack frame
}

Stack looks like:
method2() frame
method1() frame  <- age (int), person (reference)
main() frame</div></div>`
            },
            {
                id: 4,
                title: "Method Area / Metaspace",
                content: `<div class="content-header"><h2>4. Method Area / Metaspace</h2><p>Where class structures are stored</p></div>
                <div class="content-body"><p><strong>Stores:</strong></p><ul><li>Class structures</li><li>Method data (line numbers, bytecode)</li><li>Constructor code</li><li>Runtime constant pool</li><li>Static variables</li></ul>
                <div class="code-block">class MyClass {
    static int count = 0;  // In Metaspace

    public static void main() { }  // In Metaspace
}</div>
                <p><strong>Metaspace (Java 8+):</strong> Replaced PermGen, allocated from native memory</p>
                <p><strong>Old PermGen (Java 7):</strong> Fixed size, part of heap</p></div>`
            },
            {
                id: 5,
                title: "Garbage Collection",
                content: `<div class="content-header"><h2>5. Garbage Collection</h2><p>Automatic memory management</p></div>
                <div class="content-body"><p><strong>How it works:</strong></p><ul><li>GC finds unreachable objects</li><li>Marks them for deletion</li><li>Reclaims memory</li></ul>
                <p><strong>GC Algorithms:</strong></p><ul><li>Mark-Sweep</li><li>Mark-Compact</li><li>Generational GC (default)</li></ul>
                <p><strong>GC Pause:</strong> "Stop-the-world" event - app pauses during GC</p>
                <div class="tip">Shorter GC pauses = better responsiveness. Longer pauses = more efficient GC.</div></div>`
            },
            {
                id: 6,
                title: "Heap vs Stack",
                content: `<div class="content-header"><h2>6. Heap vs Stack Comparison</h2><p>Understanding the differences</p></div>
                <div class="content-body"><table style="width:100%; border-collapse: collapse; margin: 15px 0;">
                <tr style="background: #1e293b; border: 1px solid #2563eb;"><td style="padding: 10px; border: 1px solid #2563eb;"><strong>Aspect</strong></td><td style="padding: 10px; border: 1px solid #2563eb;"><strong>Heap</strong></td><td style="padding: 10px; border: 1px solid #2563eb;"><strong>Stack</strong></td></tr>
                <tr style="border: 1px solid #2563eb;"><td style="padding: 10px; border: 1px solid #2563eb;">Scope</td><td style="padding: 10px; border: 1px solid #2563eb;">Global</td><td style="padding: 10px; border: 1px solid #2563eb;">Thread-local</td></tr>
                <tr style="background: #1e293b; border: 1px solid #2563eb;"><td style="padding: 10px; border: 1px solid #2563eb;">Stores</td><td style="padding: 10px; border: 1px solid #2563eb;">Objects</td><td style="padding: 10px; border: 1px solid #2563eb;">Primitives, refs</td></tr>
                <tr style="border: 1px solid #2563eb;"><td style="padding: 10px; border: 1px solid #2563eb;">Garbage Collection</td><td style="padding: 10px; border: 1px solid #2563eb;">Yes</td><td style="padding: 10px; border: 1px solid #2563eb;">No (auto)</td></tr>
                <tr style="background: #1e293b; border: 1px solid #2563eb;"><td style="padding: 10px; border: 1px solid #2563eb;">Size</td><td style="padding: 10px; border: 1px solid #2563eb;">Larger, adjustable</td><td style="padding: 10px; border: 1px solid #2563eb;">Smaller, fixed</td></tr>
                </table></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
