<body>
    <div class="container">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>⚠️ Exceptions</h1>
            </div>
            <div id="topicsList"></div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="content-area">
            <a href="java_master_index.html" class="back-link">← Back to Master Index</a>
            <div id="contentArea">
                <div class="welcome-message">
                    <p>👈 Click on a topic to begin</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "What is Throwable?",
                content: `
                    <div class="content-header">
                        <h2>1. What is Throwable?</h2>
                        <p>The foundation of Java's exception handling mechanism</p>
                    </div>
                    <div class="content-body">
                        <p><strong>Throwable</strong> is the superclass of all errors and exceptions in the Java language.</p>
                        <p><strong>Key points:</strong></p>
                        <ul>
                            <li>Only objects that are instances of Throwable (or one of its subclasses) are thrown by the Java Virtual Machine</li>
                            <li>Only Throwable or one of its subclasses can be thrown by the Java throw statement</li>
                            <li>Only Throwable or one of its subclasses can be the argument type in a catch clause</li>
                        </ul>
                        <div class="diagram">Throwable (superclass)
│
├── Error (serious problems, JVM level)
│   ├── OutOfMemoryError
│   ├── StackOverflowError
│   └── VirtualMachineError
│
└── Exception (application level)
    ├── Checked Exceptions
    │   ├── IOException
    │   ├── SQLException
    │   └── ...
    │
    └── Unchecked Exceptions (RuntimeException)
        ├── NullPointerException
        ├── ArithmeticException
        └── ...</div>
                    </div>
                `
            },
            {
                id: 2,
                title: "Checked Exceptions",
                content: `
                    <div class="content-header">
                        <h2>2. Checked Exceptions</h2>
                        <p>Compile-time verified exceptions</p>
                    </div>
                    <div class="content-body">
                        <p><strong>Definition:</strong> Checked exceptions are checked by the Java compiler at compile time.</p>
                        <p><strong>Characteristics:</strong></p>
                        <ul>
                            <li>Modern IDEs require that methods which can throw such exceptions are either handled with try/catch blocks or throws keyword is added in method declaration</li>
                            <li>The compiler enforces compile-time checking</li>
                            <li>Must be caught or declared</li>
                            <li>Extend from Exception class (but not RuntimeException)</li>
                        </ul>
                        <p><strong>Common Checked Exceptions:</strong></p>
                        <ul>
                            <li>IOException - File operations</li>
                            <li>SQLException - Database operations</li>
                            <li>ClassNotFoundException - Class not found in classpath</li>
                            <li>InterruptedException - Thread interruption</li>
                        </ul>
                        <p><strong>Example:</strong></p>
                        <div class="diagram">// Must handle or declare
public void readFile(String filename) throws IOException {
    FileReader reader = new FileReader(filename);  // throws IOException
    reader.close();
}</div>
                    </div>
                `
            },
            {
                id: 3,
                title: "Unchecked Exceptions",
                content: `
                    <div class="content-header">
                        <h2>3. Unchecked Exceptions</h2>
                        <p>Runtime verification exceptions</p>
                    </div>
                    <div class="content-body">
                        <p><strong>Definition:</strong> Unchecked exceptions are NOT checked by the compiler and may appear only during runtime.</p>
                        <p><strong>Characteristics:</strong></p>
                        <ul>
                            <li>Subclasses of RuntimeException and Error are not checked by compiler</li>
                            <li>No compile-time requirement to catch or declare</li>
                            <li>Programmer responsibility to handle them</li>
                            <li>Extend from RuntimeException class</li>
                        </ul>
                        <p><strong>Common Unchecked Exceptions:</strong></p>
                        <ul>
                            <li>NullPointerException - Accessing null object</li>
                            <li>ArithmeticException - Division by zero</li>
                            <li>ArrayIndexOutOfBoundsException - Invalid array index</li>
                            <li>ClassCastException - Invalid type casting</li>
                            <li>IllegalArgumentException - Invalid argument</li>
                        </ul>
                        <p><strong>Example:</strong></p>
                        <div class="diagram">// No requirement to handle or declare
public void divide(int a, int b) {
    int result = a / b;  // ArithmeticException if b = 0
}</div>
                    </div>
                `
            },
            {
                id: 4,
                title: "Custom Exceptions",
                content: `
                    <div class="content-header">
                        <h2>4. Creating Custom Exceptions</h2>
                        <p>Building your own exception classes</p>
                    </div>
                    <div class="content-body">
                        <p><strong>How to create:</strong> Any amount of custom named exceptions can be created by implementing Throwable superclass or extending any of its children.</p>
                        <p><strong>Common approach:</strong></p>
                        <ul>
                            <li>Extend Exception class (for checked exceptions)</li>
                            <li>Extend RuntimeException (for unchecked exceptions)</li>
                            <li>Provide constructors that accept message and cause</li>
                        </ul>
                        <p><strong>Example:</strong></p>
                        <div class="diagram">// Custom Checked Exception
public class InvalidUserException extends Exception {
    public InvalidUserException(String message) {
        super(message);
    }

    public InvalidUserException(String message, Throwable cause) {
        super(message, cause);
    }
}

// Custom Unchecked Exception
public class InsufficientBalanceException extends RuntimeException {
    public InsufficientBalanceException(String message) {
        super(message);
    }
}</div>
                        <p><strong>Usage in exception handling:</strong></p>
                        <div class="diagram">// Throwing custom exception
public void validateUser(String username) throws InvalidUserException {
    if (username == null || username.isEmpty()) {
        throw new InvalidUserException("Username cannot be empty");
    }
}</div>
                    </div>
                `
            },
            {
                id: 5,
                title: "Exception Handling Strategies",
                content: `
                    <div class="content-header">
                        <h2>5. Exception Handling Strategies</h2>
                        <p>Best practices for handling exceptions</p>
                    </div>
                    <div class="content-body">
                        <p><strong>Two common approaches:</strong></p>
                        <ol>
                            <li><strong>Logging Exception</strong> - Record the exception in a structured manner for debugging and monitoring</li>
                            <li><strong>Seeking Alternative Value</strong> - Provide a fallback or default value when an operation fails</li>
                        </ol>
                        <p><strong>Logging Example:</strong></p>
                        <div class="diagram">try {
    // Risky operation
    processData(data);
} catch (IOException e) {
    // Log the exception
    logger.error("Failed to process data", e);
    // Notify user
    handleError(e);
}</div>
                        <p><strong>Alternative Value Example:</strong></p>
                        <div class="diagram">public int getValue(String key, int defaultValue) {
    try {
        return Integer.parseInt(key);
    } catch (NumberFormatException e) {
        // Return alternative value instead of propagating exception
        return defaultValue;
    }
}</div>
                        <div class="tip">
                            <strong>Best Practice:</strong> Don't silently swallow exceptions. Either log them properly or provide meaningful fallback behavior.
                        </div>
                    </div>
                `
            }
        ];

        // Populate sidebar
        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            item.id = `topic-${topic.id}`;
            topicsList.appendChild(item);
        });

        // Select topic
        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
