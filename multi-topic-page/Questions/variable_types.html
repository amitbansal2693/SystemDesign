<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Variables - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.3em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>📊 Variables</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_keywords_index.html" class="back-link">← Back to Keywords</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "Local Variables",
                content: `<div class="content-header"><h2>1. Local Variables</h2><p>Variables declared inside methods/blocks</p></div>
                <div class="content-body"><p><strong>Characteristics:</strong></p><ul><li>Declared inside method, constructor, block</li><li>Exist only during method execution</li><li>Stored in Stack memory</li><li>NO default values - must initialize before use</li><li>Name can be reused in different methods</li></ul>
                <div class="code-block">void calculate() {
    int x = 10;           // Local variable
    String name = "Java"; // Local variable
    System.out.println(x);
    // x no longer accessible after method ends
}</div></div>`
            },
            {
                id: 2,
                title: "Instance Variables",
                content: `<div class="content-header"><h2>2. Instance Variables</h2><p>Variables declared in class, outside methods</p></div>
                <div class="content-body"><p><strong>Characteristics:</strong></p><ul><li>Declared at class level</li><li>One copy per object</li><li>Stored in Heap memory</li><li>Get default values if not initialized</li><li>Can be accessed from all methods</li><li>Accessible with 'this' keyword</li></ul>
                <div class="code-block">class Student {
    String name;      // Instance variable (default null)
    int age;          // Instance variable (default 0)
    double gpa = 3.5; // Initialized
}</div></div>`
            },
            {
                id: 3,
                title: "Static Variables",
                content: `<div class="content-header"><h2>3. Static Variables</h2><p>Class-level variables shared by all objects</p></div>
                <div class="content-body"><p><strong>Characteristics:</strong></p><ul><li>Declared with 'static' keyword</li><li>Single copy for entire class</li><li>Stored in Metaspace (Class Area)</li><li>Get default values if not initialized</li><li>Accessible from static and instance methods</li><li>Initialized when class loads</li></ul>
                <div class="code-block">class Employee {
    static String company = "TechCorp";
    static int employeeCount = 0;

    // Shared by all Employee objects
}</div></div>`
            },
            {
                id: 4,
                title: "Memory Locations",
                content: `<div class="content-header"><h2>4. Memory Storage</h2><p>Where variables are stored</p></div>
                <div class="content-body"><p><strong>Stack Memory:</strong></p><ul><li>Local variables</li><li>Method calls</li><li>Quick access, auto cleanup</li></ul>
                <p><strong>Heap Memory:</strong></p><ul><li>Instance variables (objects)</li><li>Dynamic allocation</li><li>Garbage collected</li></ul>
                <p><strong>Metaspace:</strong></p><ul><li>Static variables</li><li>Class metadata</li><li>Lives for program lifetime</li></ul></div>`
            },
            {
                id: 5,
                title: "Default Values",
                content: `<div class="content-header"><h2>5. Default Values</h2><p>Initialization for instance and static variables</p></div>
                <div class="content-body"><p><strong>Numeric:</strong> 0 (int, long), 0.0 (float, double)</p>
                <p><strong>Boolean:</strong> false</p>
                <p><strong>Char:</strong> '\\0' (null character)</p>
                <p><strong>Objects/Strings:</strong> null</p>
                <div class="tip">Local variables DO NOT get default values and must be initialized before use!</div></div>`
            },
            {
                id: 6,
                title: "Variable Scope & Lifetime",
                content: `<div class="content-header"><h2>6. Scope & Lifetime</h2><p>When variables are accessible</p></div>
                <div class="content-body"><p><strong>Local Variables:</strong> Scope = method block, Lifetime = method execution</p>
                <p><strong>Instance Variables:</strong> Scope = entire class, Lifetime = object existence</p>
                <p><strong>Static Variables:</strong> Scope = entire class, Lifetime = program execution</p>
                <div class="code-block">class Example {
    static int global = 10;       // Program lifetime
    String instance = "test";     // Object lifetime

    void method() {
        int local = 5;            // Method lifetime
    }
}</div></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
