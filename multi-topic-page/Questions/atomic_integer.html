<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java AtomicInteger - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.3em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>⚛️ AtomicInteger</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_keywords_index.html" class="back-link">← Back to Keywords</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "Why AtomicInteger?",
                content: `<div class="content-header"><h2>1. Why AtomicInteger?</h2><p>Thread-safe integer operations</p></div>
                <div class="content-body"><p><strong>Problem with Regular int:</strong></p>
                <div class="code-block">int counter = 0;
counter++;  // ❌ NOT atomic! 3 operations:
           // 1. Read current value
           // 2. Increment
           // 3. Write back</div>
                <p><strong>Race Condition:</strong> Two threads both see 0, increment to 1, final result is 1 instead of 2!</p>
                <p><strong>Solution:</strong> Use AtomicInteger for thread-safe operations</p></div>`
            },
            {
                id: 2,
                title: "AtomicInteger Basics",
                content: `<div class="content-header"><h2>2. AtomicInteger Basics</h2><p>Usage and common methods</p></div>
                <div class="content-body"><p><strong>Creation:</strong></p>
                <div class="code-block">AtomicInteger counter = new AtomicInteger(0);
AtomicInteger value = new AtomicInteger();  // default 0</div>
                <p><strong>Common Methods:</strong></p>
                <div class="code-block">counter.get();              // Get value
counter.set(10);            // Set value
counter.incrementAndGet();  // ++counter (atomic)
counter.getAndIncrement();  // counter++ (atomic)
counter.addAndGet(5);       // counter += 5 (atomic)
counter.compareAndSet(10, 20);  // CAS operation</div></div>`
            },
            {
                id: 3,
                title: "Thread-Safe Counter Example",
                content: `<div class="content-header"><h2>3. Thread-Safe Counter</h2><p>Real-world usage pattern</p></div>
                <div class="content-body"><div class="code-block">class Counter {
    private AtomicInteger value = new AtomicInteger(0);

    public void increment() {
        value.incrementAndGet();  // ✅ Atomic - thread-safe
    }

    public int getValue() {
        return value.get();
    }
}

// Usage
Counter counter = new Counter();
for (int i = 0; i < 10; i++) {
    counter.increment();  // Safe from multiple threads
}</div></div>`
            },
            {
                id: 4,
                title: "Compare-And-Swap (CAS)",
                content: `<div class="content-header"><h2>4. Compare-And-Swap (CAS)</h2><p>Atomic conditional update</p></div>
                <div class="content-body"><p><strong>Method:</strong> compareAndSet(expectedValue, newValue)</p>
                <div class="code-block">AtomicInteger value = new AtomicInteger(10);

boolean success = value.compareAndSet(10, 20);
// If current value is 10, set to 20 and return true
// Otherwise return false (atomically!)</div>
                <p><strong>Use Case:</strong> Check-then-update in multithreaded code</p></div>`
            },
            {
                id: 5,
                title: "AtomicInteger vs Synchronized",
                content: `<div class="content-header"><h2>5. AtomicInteger vs Synchronized</h2><p>Performance comparison</p></div>
                <div class="content-body"><p><strong>Synchronized:</strong></p>
                <div class="code-block">private int counter = 0;
synchronized void increment() {
    counter++;  // Lock acquired, critical section, lock released
}</div>
                <p><strong>AtomicInteger:</strong></p>
                <div class="code-block">private AtomicInteger counter = new AtomicInteger(0);
void increment() {
    counter.incrementAndGet();  // Lock-free, CAS operation
}</div>
                <p><strong>Comparison:</strong></p><ul><li>Atomic = Lock-free, faster under contention</li><li>Synchronized = Lock-based, simpler logic</li></ul></div>`
            },
            {
                id: 6,
                title: "All Atomic Classes",
                content: `<div class="content-header"><h2>6. All Atomic Classes</h2><p>Complete atomic type families</p></div>
                <div class="content-body"><p><strong>Primitives:</strong></p><ul><li>AtomicInteger</li><li>AtomicLong</li><li>AtomicBoolean</li></ul>
                <p><strong>References:</strong></p><ul><li>AtomicReference&lt;T&gt;</li><li>AtomicMarkableReference&lt;T&gt;</li><li>AtomicStampedReference&lt;T&gt;</li></ul>
                <p><strong>Arrays:</strong></p><ul><li>AtomicIntegerArray</li><li>AtomicLongArray</li><li>AtomicReferenceArray&lt;T&gt;</li></ul>
                <div class="tip">All are in java.util.concurrent.atomic package, introduced in Java 5.</div></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
