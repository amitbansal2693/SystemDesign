    .qa-title {
      font-size: 24px;

    .qa-pair {
      background: var(--surface-2);

      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;

    .qa-pair:hover {
      border-color: var(--border-strong);
      background: var(--surface-1);
    }

    .qa-pair.expanded {
      border-color: var(--border-strong);
    }

    .qa-number {

      font-size: 12px;

    .qa-pair.expanded .answer {

      margin-top: 12px;

      border-top: 0.5px solid var(--border);

    .toggle-icon {
      display: inline-block;

      margin-left: auto;
    }

    .qa-pair.expanded .toggle-icon {
      transform: rotate(180deg);

    .center-content {
      display: flex;

      align-items: center;

<script>

  const topics = [

    {
      name: "Foundation",
      icon: "🏗️",
      questions: [

        {
          q: "What is ORM?",
          a: "ORM = Object Relational Mapping.<br><br>It is a technique that maps Java objects to database tables.<br><br>Java → Database<br>Class → Table<br>Object → Row<br>Field → Column<br><br>ORM acts as a translator layer:<br>Java Object → ORM → SQL → Database<br>Database → ORM → Java Object"
        },

        {
          q: "Why is ORM needed?",
          a: "Before ORM, developers used JDBC and manually wrote SQL.<br><br>Problems:<br>• Too much boilerplate code<br>• Manual SQL writing<br>• Error-prone<br>• Hard to maintain<br><br>With ORM, you work with objects and Hibernate handles SQL generation."
        },

        {
          q: "What is Object-Relational Impedance Mismatch?",
          a: "Java uses objects while relational databases use tables. Mapping between these two models is not natural.<br><br>Example:<br><br>Java:<br>class Employee {<br>String name;<br>Address address;<br>}<br><br>Database:<br>EMPLOYEE table<br>ADDRESS table<br><br>This difference between the object-oriented world and relational world is called impedance mismatch."
        },

        {
          q: "What is JPA?",
          a: "JPA = Java Persistence API.<br><br>JPA is a specification or rulebook for:<br>• Mapping Java objects to database tables<br>• Performing CRUD operations<br>• Managing object lifecycle<br><br>JPA does NOT perform the actual database work. It defines how the work should be done."
        },

        {
          q: "Why is JPA needed?",
          a: "Different ORM tools historically had different APIs. This could create vendor lock-in and make switching implementations difficult.<br><br>JPA provides one standard API such as EntityManager that can work with different implementations.<br><br>JPA = abstraction over ORM tools."
        },

        {
          q: "What is Hibernate?",
          a: "Hibernate is an ORM framework and implementation of JPA.<br><br>It is a Java library that:<br>• Implements JPA<br>• Converts Java objects to SQL<br>• Interacts with the database<br>• Performs SQL generation<br>• Provides caching and dirty checking<br>• Supports lazy loading"
        },

        {
          q: "What is the relationship between ORM, JPA and Hibernate?",
          a: "ORM = Concept / technique<br>JPA = Specification / rules<br>Hibernate = Implementation / engine<br><br>Simple mental model:<br><br>ORM → Idea<br>JPA → Rules<br>Hibernate → Actual implementation<br><br>The notes summarize this as:<br>ORM (Concept)<br>↓<br>JPA (Specification / Rules)<br>↓<br>Hibernate (Implementation / Tool)"
        },

        {
          q: "What is the most important difference between JPA and Hibernate?",
          a: "JPA defines what should be done through standard APIs and rules.<br><br>Hibernate implements those rules and performs the actual work, including SQL generation and database interaction.<br><br>JPA = WHAT to do<br>Hibernate = HOW to do"
        },

        {
          q: "How does the complete JPA/Hibernate flow work?",
          a: "Your Java code<br>↓<br>JPA / EntityManager<br>↓<br>Persistence Context<br>↓<br>Hibernate ORM engine<br>↓<br>SQL<br>↓<br>Database<br><br>Example:<br>Employee emp = em.find(Employee.class, 1);<br><br>Hibernate ultimately generates the required SQL and interacts with the database."
        }

      ]
    },

    {
      name: "Core Building Blocks",
      icon: "🧩",
      questions: [

        {
          q: "What is an Entity?",
          a: "An Entity is a Java class mapped to a database table using JPA annotations.<br><br>Example:<br><br>@Entity<br>@Table(name = \"employee\")<br>public class Employee {<br>    @Id<br>    private int id;<br>    private String name;<br>    private double salary;<br>}<br><br>Mapping:<br>Employee class → EMPLOYEE table<br>id → id column<br>name → name column<br>salary → salary column"
        },

        {
          q: "What happens when Hibernate starts with Entity classes?",
          a: "The notes describe the following high-level flow:<br><br>1. Application starts<br>2. Hibernate scans @Entity classes<br>3. Hibernate reads annotations such as @Table and @Id<br>4. Hibernate builds metadata<br>5. Tables can be created if configured<br><br>So an Entity acts as the structure and mapping definition."
        },

        {
          q: "What is EntityManager?",
          a: "EntityManager is a JPA API object/interface responsible for managing entities, their lifecycle and CRUD operations by interacting with the persistence context.<br><br>Simple mental model:<br>Entity → WHAT<br>EntityManager → WHO manages it<br>Hibernate → HOW it is executed"
        },

        {
          q: "What are the important EntityManager CRUD operations?",
          a: "Create:<br>em.persist(emp);<br><br>Read:<br>em.find(...);<br><br>Update:<br>em.merge(emp);<br><br>Delete:<br>em.remove(emp);"
        },

        {
          q: "What happens internally when persist() is called?",
          a: "Example:<br><br>Employee emp = new Employee();<br>emp.setId(1);<br>emp.setName(\"Raj\");<br>em.persist(emp);<br><br>Flow:<br>1. EntityManager receives the object<br>2. Object is stored in the Persistence Context<br>3. Entity becomes Managed<br>4. Hibernate prepares/generates the SQL<br>5. Database operation occurs as part of the transaction/flush flow"
        },

        {
          q: "Why is EntityManager needed?",
          a: "The notes describe EntityManager as handling responsibilities that developers should not manage manually:<br><br>• Performing entity CRUD operations<br>• Managing entity lifecycle<br>• Interacting with the persistence context<br>• Tracking objects<br><br>This avoids directly managing all database interaction and object state."
        },

        {
          q: "Does EntityManager immediately hit the database for every operation?",
          a: "Not necessarily.<br><br>The notes emphasize that EntityManager works with the Persistence Context. Changes can remain in memory and SQL can be executed when the transaction commits or when a flush is required.<br><br>Mental model:<br>Developer → EntityManager → Persistence Context → Hibernate → SQL → Database"
        },

        {
          q: "What is EntityManagerFactory vs EntityManager?",
          a: "The provided notes identify the topic 'EntityManagerFactory vs EntityManager', but the detailed comparison is not developed in the source material provided. Therefore, no additional comparison has been added here."
        }

      ]
    },

    {
      name: "Persistence Context",
      icon: "🧠",
      questions: [

        {
          q: "What is Persistence Context?",
          a: "Persistence Context is the memory area where JPA/Hibernate keeps managed entity objects and tracks their changes.<br><br>The notes simplify it as:<br><br>Persistence Context = Map&lt;ID, Entity&gt; + Change Tracker<br><br>It acts as a cache and tracks entity state changes."
        },

        {
          q: "Is Persistence Context just a queue?",
          a: "No. The notes specifically describe it as a cache that stores entity objects and tracks their changes.<br><br>For reads, it checks the cache first.<br>For create/update/delete operations, it tracks changes in memory and synchronizes them with the database during flush/commit."
        },

        {
          q: "How does find() interact with the Persistence Context?",
          a: "Example:<br><br>Employee emp = em.find(Employee.class, 1);<br><br>Step 1: Check the Persistence Context.<br><br>If the entity is already present:<br>→ Return the object<br>→ No database hit<br><br>If it is not present:<br>→ Generate SELECT SQL<br>→ Hit database<br>→ Create Employee object<br>→ Store it in Persistence Context<br>→ Return object"
        },

        {
          q: "Why can two find() calls return the same object instance?",
          a: "Example:<br><br>Employee e1 = em.find(Employee.class, 1);<br>Employee e2 = em.find(Employee.class, 1);<br><br>System.out.println(e1 == e2);<br><br>The notes explain that both lookups use the same Persistence Context entry, so the same managed object instance can be returned."
        },

        {
          q: "How does CREATE work through the Persistence Context?",
          a: "Example:<br><br>Employee emp = new Employee();<br>em.persist(emp);<br><br>Flow:<br>Transient object<br>↓<br>persist()<br>↓<br>Stored in Persistence Context<br>↓<br>Marked Managed<br>↓<br>INSERT during commit/flush"
        },

        {
          q: "How does UPDATE work through the Persistence Context?",
          a: "Example:<br><br>Employee emp = em.find(Employee.class, 1);<br>emp.setName(\"Rahul\");<br><br>Flow:<br>1. Entity is already Managed<br>2. Object is modified<br>3. Persistence Context tracks the change<br>4. No explicit update call is required according to the notes<br>5. UPDATE is generated during commit/flush"
        },

        {
          q: "How does DELETE work through the Persistence Context?",
          a: "Example:<br><br>Employee emp = em.find(Employee.class, 1);<br>em.remove(emp);<br><br>Flow:<br>1. Entity must be Managed<br>2. remove() marks it as Removed<br>3. Entity remains associated with the Persistence Context until commit<br>4. DELETE is executed at commit/flush"
        },

        {
          q: "What is the complete CRUD mental model?",
          a: "CREATE:<br>persist() → store in map → INSERT at commit<br><br>READ:<br>check map → otherwise DB → store in map<br><br>UPDATE:<br>modify object → tracked → UPDATE at commit<br><br>DELETE:<br>mark removed → DELETE at commit"
        }

      ]
    },

    {
      name: "Entity Lifecycle",
      icon: "🔄",
      questions: [

        {
          q: "What is Entity Lifecycle?",
          a: "Entity lifecycle defines the different states an object goes through while interacting with the database.<br><br>The notes summarize the flow as:<br><br>Transient → Managed → Detached → Removed"
        },

        {
          q: "What is the Transient state?",
          a: "Transient means the object exists only in Java memory.<br><br>Example:<br><br>Employee emp = new Employee();<br>emp.setName(\"Raj\");<br><br>State:<br>Only in memory ✅<br>Database ❌<br>Tracked ❌"
        },

        {
          q: "What is the Managed/Persistent state?",
          a: "A Managed entity is inside the Persistence Context and is tracked by EntityManager.<br><br>Examples:<br><br>em.persist(emp);<br><br>or<br><br>Employee emp = em.find(Employee.class, 1);<br><br>State:<br>In memory ✅<br>Tracked ✅<br>Database synchronization happens automatically through the persistence mechanism.<br><br>Dirty checking works in this state."
        },

        {
          q: "What is the Detached state?",
          a: "A Detached entity still exists as an object but is no longer tracked by the Persistence Context.<br><br>Example:<br><br>em.detach(emp);<br><br>The notes also describe transaction/session completion as a point where an entity can become detached.<br><br>State:<br>Object exists ✅<br>Tracked ❌<br>Changes are not automatically saved ❌"
        },

        {
          q: "What is the Removed state?",
          a: "Removed means the entity has been marked for deletion.<br><br>Example:<br><br>em.remove(emp);<br><br>The entity is marked for deletion and the DELETE operation occurs during commit/flush."
        },

        {
          q: "Why is understanding Entity Lifecycle important?",
          a: "Because important JPA behavior depends on the entity state.<br><br>The notes emphasize:<br>• Dirty checking works in the Managed state<br>• Remove applies to a managed entity<br>• persist() changes a new/transient object into a managed entity<br><br>So you must know what state your object is currently in."
        },

        {
          q: "What is the complete Entity Lifecycle flow?",
          a: "Transient<br>↓ persist()<br>Managed<br>↓ detach()<br>Detached<br>↓ remove()<br>Removed"
        }

      ]
    },

    {
      name: "Relationships",
      icon: "🔗",
      questions: [

        {
          q: "What relationship types are listed in the Hibernate/JPA roadmap?",
          a: "The notes list four relationship types:<br><br>• OneToOne<br>• OneToMany<br>• ManyToOne<br>• ManyToMany"
        },

        {
          q: "What is the role of Relationships in JPA?",
          a: "Relationships belong to the Data Modeling section of the notes and represent how entities relate to one another.<br><br>The provided source lists OneToOne, OneToMany, ManyToOne and ManyToMany, but does not provide detailed explanations or examples for each relationship."
        },

        {
          q: "Are detailed relationship examples included in the provided notes?",
          a: "The roadmap identifies relationships as an important Hibernate/JPA topic, but the detailed content available in the source focuses mainly on lifecycle, persistence context, fetching, transactions, caching and dirty checking. No additional relationship behavior has been invented here."
        }

      ]
    },

    {
      name: "Fetching & Performance",
      icon: "⚡",
      questions: [

        {
          q: "What is Fetching in JPA?",
          a: "Fetching defines how related data is loaded from the database.<br><br>The two approaches in the notes are:<br>• EAGER<br>• LAZY"
        },

        {
          q: "What is EAGER fetching?",
          a: "EAGER means related data is loaded immediately.<br><br>The notes use the idea:<br>\"Load everything NOW\"<br><br>Example concept:<br>Employee is loaded → Address is also loaded.<br><br>Problem:<br>Even if the related data is not needed, it may still be loaded, increasing memory usage and potentially hurting performance."
        },

        {
          q: "What is LAZY fetching?",
          a: "LAZY means related data is loaded only when it is accessed.<br><br>Example:<br><br>Employee emp = em.find(Employee.class, 1);<br><br>The employee is loaded first.<br><br>Later:<br><br>emp.getAddresses();<br><br>The related data is loaded when accessed.<br><br>The notes describe the relationship as a proxy until the data is needed."
        },

        {
          q: "What is the difference between LAZY and EAGER?",
          a: "EAGER → load immediately<br>LAZY → load on demand<br><br>Analogy from the notes:<br>EAGER = order burger + fries + drink together.<br>LAZY = order burger first and fries later when needed."
        },

        {
          q: "What default fetching behavior is mentioned in the notes?",
          a: "The notes state:<br><br>@OneToMany → LAZY<br>@ManyToOne → EAGER"
        },

        {
          q: "When should LAZY fetching be considered?",
          a: "The notes recommend LAZY for:<br>• Large data<br>• Collections<br>• Performance-sensitive scenarios<br><br>The reason is that related data is loaded only when needed."
        },

        {
          q: "When should EAGER fetching be considered?",
          a: "The notes suggest EAGER when related data is small and always needed.<br><br>The trade-off is that EAGER can overload the application if unnecessary related data is loaded."
        },

        {
          q: "What is the N+1 query problem?",
          a: "N+1 happens when one query fetches the main entities and then N additional queries fetch related data for each entity.<br><br>Formula:<br><br>1 query → main data<br>+<br>N queries → related data<br>= N + 1 queries"
        },

        {
          q: "Can you explain N+1 with the Employee/Address example?",
          a: "Suppose three employees are loaded:<br><br>SELECT * FROM employee;<br><br>Then code accesses addresses for every employee:<br><br>SELECT * FROM address WHERE emp_id = 1;<br>SELECT * FROM address WHERE emp_id = 2;<br>SELECT * FROM address WHERE emp_id = 3;<br><br>Total:<br>1 + 3 = 4 queries.<br><br>For 100 employees, the notes show the problem as 101 queries."
        },

        {
          q: "Why is N+1 a performance problem?",
          a: "The notes identify three major problems:<br><br>• Too many database calls<br>• Slow performance<br>• Network overhead<br><br>The core issue is that related data is fetched one-by-one rather than efficiently together."
        },

        {
          q: "What is the senior-level insight about LAZY vs EAGER?",
          a: "LAZY is generally good for performance because data is loaded only when needed, but it can lead to N+1 queries.<br><br>EAGER is simpler because data is loaded immediately, but it can overload the system by loading data that may not be required."
        },

        {
          q: "What is Dirty Checking?",
          a: "Dirty checking means JPA automatically detects changes made to a managed entity and synchronizes those changes with the database without explicitly writing an update query.<br><br>Simple mental model:<br>You change object → JPA notices → DB updated"
        },

        {
          q: "How does Dirty Checking work internally?",
          a: "The notes describe this sequence:<br><br>1. Entity is loaded into the Persistence Context<br>2. JPA keeps the original state<br>3. You modify the object<br>4. JPA compares old and new state<br>5. If changed, Hibernate generates an UPDATE query<br><br>Example SQL:<br>UPDATE employee SET name = 'Rahul' WHERE id = 1;"
        },

        {
          q: "When does Dirty Checking work?",
          a: "Dirty checking works when the entity is in the Managed state inside the Persistence Context.<br><br>Transient example:<br>Employee emp = new Employee();<br>emp.setName(\"Rahul\");<br>→ No dirty checking because the entity is not managed.<br><br>Managed example:<br>Employee emp = em.find(Employee.class, 1);<br>emp.setName(\"Rahul\");<br>→ Dirty checking works."
        },

        {
          q: "When does the UPDATE actually happen with Dirty Checking?",
          a: "The notes emphasize that the UPDATE does not happen immediately when the Java field is changed.<br><br>The UPDATE occurs during transaction commit/flush.<br><br>Persistence Context<br>↓<br>Dirty Checking<br>↓<br>SQL generated<br>↓<br>Commit/flush"
        }

      ]
    },

    {
      name: "Transactions",
      icon: "💳",
      questions: [

        {
          q: "What is a Transaction in JPA?",
          a: "A transaction is a unit of work where database operations are completed as one logical operation.<br><br>Either:<br>✅ Everything succeeds<br>❌ Everything fails and rolls back<br><br>The notes use a bank transfer analogy: if money is deducted but the second step fails, the first step must also be rolled back."
        },

        {
          q: "Why are Transactions needed?",
          a: "Without transactions, one database operation could succeed while another fails, leaving inconsistent data.<br><br>Example:<br>INSERT succeeds<br>UPDATE fails<br>→ inconsistent state<br><br>With a transaction:<br>All succeed → COMMIT<br>Any failure → ROLLBACK"
        },

        {
          q: "How does a Transaction connect with the Persistence Context?",
          a: "The Persistence Context stores and tracks changes in memory.<br><br>The transaction controls when those changes are flushed to the database.<br><br>Mental model:<br>EntityManager<br>↓<br>Persistence Context<br>↓<br>Transaction COMMIT<br>↓<br>FLUSH<br>↓<br>SQL Execution"
        },

        {
          q: "What happens in this transaction example?",
          a: "@Transactional<br>public void createEmployee() {<br>    Employee emp = new Employee();<br>    emp.setName(\"Raj\");<br>    em.persist(emp);<br>    emp.setName(\"Rahul\");<br>}<br><br>According to the notes:<br>1. Transaction starts<br>2. persist() stores the entity in Persistence Context<br>3. Name change is tracked<br>4. SQL is not immediately executed<br>5. Transaction commits<br>6. Hibernate flushes and executes the required SQL"
        },

        {
          q: "What is Flush?",
          a: "Flush means synchronizing the Persistence Context with the database.<br><br>Persistence Context<br>↓<br>SQL<br>↓<br>Database<br><br>The notes state that flushing can happen automatically on transaction commit and sometimes before queries."
        },
