                <div class="code-block">List list = new ArrayList();

                <p><strong>Issues:</strong></p>

                <li>Explicit casting required</li>
                <li>Higher chance of ClassCastException</li>
                </ul>
                <p><strong>Solution - Generics:</strong> Introduce compile-time type safety.</p>

├─ C → Consumer
└─ S → Super</div>

                <div class="code-block">Producer → extends → Read
Consumer → super   → Write

extends = Read
super   = Write</div>

                <div class="code-block">// Reader (Producer) - use extends
public void printAll(List<? extends Number> numbers) {

    }
}

// Writer (Consumer) - use super
public void fillWithNumbers(List<? super Integer> list) {
    list.add(1);
    list.add(2);
    list.add(3);
}</div></div>`

                <div class="content-body">
                <p><strong>Question:</strong> How does Java maintain backward compatibility with pre-generic code?</p>
                <p><strong>Answer:</strong> Through TYPE ERASURE.</p>
                <p><strong>Concept:</strong> Generic type information is removed during compilation.</p>
                <div class="code-block">List<String>
       ↓
Compile
       ↓
List</div>
                <p><strong>Examples:</strong></p>
                <div class="code-block">List<String> list1 = new ArrayList<>();
List<Integer> list2 = new ArrayList<>();

// At runtime:
list1.getClass() == list2.getClass();  // true!

// Both represent the same List class</div>
                <p><strong>How Compiler Uses Generics:</strong></p>
                <div class="code-block">Source Code
   ↓
Generic Type Checking
   ↓
Insert Type Casts where needed
   ↓
Type-Erased Bytecode
   ↓
JVM executes</div>
                <p><strong>Interview Answer:</strong></p>

                <p><strong>USE Generics When:</strong></p>
                <ul>
                <li><strong>Logic is the same:</strong> Box<String> and Box<Integer> have identical behavior</li>
                <li><strong>Building reusable components:</strong> Repository<T> works for any entity</li>
                <li><strong>Designing APIs:</strong> Express expected type clearly</li>
                <li><strong>Framework development:</strong> Reusable abstractions benefit from generics</li>
                <li><strong>Want compile-time type safety:</strong> Prevent runtime ClassCastException</li>
                </ul>
                <p><strong>DON'T Overuse Generics When:</strong></p>
                <ul>
                <li><strong>Only one type needed:</strong> StringBox might be clearer than Box<T></li>
                <li><strong>Logic heavily depends on concrete type:</strong> Implementation completely different for each type</li>
                <li><strong>Over-engineering:</strong> Generics add complexity without benefit</li>
                </ul>
                <p><strong>Rule:</strong> Use generics when they improve reuse, type safety, or API design - not just to make code look generic.</p></div>`

                title: "28. Final Interview Answer",
                content: `<div class="content-header"><h2>28. Complete Interview Answer</h2><p>What are Java Generics?</p></div>
                <div class="content-body">
                <p><strong>Full Answer:</strong></p>
                <p>Generics allow us to write reusable code that works with different types while maintaining compile-time type safety. They were introduced to solve the type-safety problems of pre-Java-5 collections, where incorrect types could be inserted and failures happened at runtime through ClassCastException.</p>
                <p>In Java, generics can be used with classes, methods and interfaces. If I need to restrict the allowed types, I can use bounded generics such as T extends Number or multiple bounds. If the exact generic type is unknown or I need to accept a family of related generic types, I use wildcards such as ?, ? extends T, or ? super T.</p>
                <p>For wildcards, I remember PECS: Producer Extends, Consumer Super. ? extends T is mainly used for reading, while ? super T is mainly used for writing.</p>
                <p>Internally, Java uses type erasure, so generic type information is primarily used by the compiler for type checking and is not fully retained as parameterized runtime types. This also explains limitations such as no primitive generic arguments, no new T(), generic-array restrictions, and inability to use instanceof List<String>.</p></div>`

                <ol>
                <li>Look for common superclass or interface</li>
                <li>Use bounded generics with extends</li>
                <li>For multiple requirements, use multiple bounds</li>
                </ol>
                <p><strong>Example - Single Bound:</strong></p>
                <div class="code-block">class NumberBox<T extends Number> {
    private T value;
}</div>
                <p><strong>Example - Multiple Bounds:</strong></p>
                <div class="code-block">class ComparableNumber<T extends Number & Comparable<T>> {
    private T value;
}</div>
                <p><strong>If types are unrelated:</strong></p>
                <ul>
                <li>Introduce common interface</li>
                <li>Use wrapper design</li>
                <li>Runtime validation when necessary</li>
