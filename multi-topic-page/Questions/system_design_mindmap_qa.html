<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--surface-0); color: var(--text-primary); }

.container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }

.header { text-align: center; margin-bottom: 2rem; }
.header h1 { font-size: 28px; font-weight: 500; margin-bottom: 0.5rem; }
.header p { color: var(--text-secondary); font-size: 14px; }

.mindmap-view { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

.topic-card {
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-height: 120px;
  justify-content: center;
}

.topic-card:hover {
  border-color: var(--border-strong);
  background: var(--surface-1);
  transform: translateY(-2px);
}

.topic-icon {
  font-size: 28px;
  display: inline-block;
}

.topic-name {
  font-weight: 500;
  font-size: 14px;
  line-height: 1.3;
}

.qa-view { display: none; }
.qa-view.active { display: block; }

.qa-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--border);
}

.back-btn {
  background: none;
  border: 0.5px solid var(--border);
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-primary);
  font-size: 14px;
  transition: all 0.2s;
}

.back-btn:hover {
  background: var(--surface-1);
  border-color: var(--border-strong);
}

.qa-title {
  font-size: 24px;
  font-weight: 500;
}

.qa-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.qa-pair {
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.qa-pair:hover {
  border-color: var(--border-strong);
  background: var(--surface-1);
}

.qa-pair.expanded {
  border-color: var(--border-strong);
}

.qa-number {
  display: inline-block;
  background: var(--fill-accent);
  color: var(--on-accent);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  text-align: center;
  line-height: 28px;
  font-size: 12px;
  font-weight: 500;
  margin-right: 8px;
}

.question {
  font-weight: 500;
  font-size: 15px;
  color: var(--text-primary);
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
  padding-left: 36px;
}

.qa-pair.expanded .answer {
  max-height: 2000px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
}

.toggle-icon {
  display: inline-block;
  transition: transform 0.3s;
  margin-left: auto;
}

.qa-pair.expanded .toggle-icon {
  transform: rotate(180deg);
}

.center-content {
  display: flex;
  gap: 12px;
  align-items: center;
  width: 100%;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>System Design Interview Questions</h1>
    <p>Navigate through 9 core topics · Click to explore Q&A pairs</p>
  </div>

  <!-- MINDMAP VIEW -->
  <div class="mindmap-view" id="mindmapView">
    <div class="topic-card" onclick="showTopic(0)">
      <span class="topic-icon">🐌</span>
      <span class="topic-name">Slowness & Diagnosis</span>
    </div>
    <div class="topic-card" onclick="showTopic(1)">
      <span class="topic-icon">⚖️</span>
      <span class="topic-name">Trade-offs</span>
    </div>
    <div class="topic-card" onclick="showTopic(2)">
      <span class="topic-icon">🔄</span>
      <span class="topic-name">Consistency</span>
    </div>
    <div class="topic-card" onclick="showTopic(3)">
      <span class="topic-icon">🌐</span>
      <span class="topic-name">Service-to-Service</span>
    </div>
    <div class="topic-card" onclick="showTopic(4)">
      <span class="topic-icon">⚡</span>
      <span class="topic-name">Load Balancer</span>
    </div>
    <div class="topic-card" onclick="showTopic(5)">
      <span class="topic-icon">🔒</span>
      <span class="topic-name">Concurrency</span>
    </div>
    <div class="topic-card" onclick="showTopic(6)">
      <span class="topic-icon">💾</span>
      <span class="topic-name">Cache</span>
    </div>
    <div class="topic-card" onclick="showTopic(7)">
      <span class="topic-icon">📢</span>
      <span class="topic-name">Event-based</span>
    </div>
    <div class="topic-card" onclick="showTopic(8)">
      <span class="topic-icon">🔐</span>
      <span class="topic-name">Authorization</span>
    </div>
  </div>

  <!-- QA VIEWS -->
  <div class="qa-view active" id="qaView">
    <div class="qa-header">
      <button class="back-btn" onclick="showMindmap()">← Back</button>
      <span id="qaTitle" class="qa-title"></span>
    </div>
    <div class="qa-container" id="qaContainer"></div>
  </div>
</div>

<script>
const topics = [
  {
    name: "Slowness & Diagnosis",
    icon: "🐌",
    questions: [
      {
        q: "How do you detect system slowness when traffic doubles?",
        a: "Monitor key metrics: Response time (p50, p95, p99), Error rate, CPU >70%, Memory utilization, Garbage collection pause time, Network latency, Database query time, Cache hit ratio drop, Connection pool usage. Set alerts at 60% threshold. Use distributed tracing to identify bottleneck layer (API vs DB vs Cache)."
      },
      {
        q: "Traffic spiked 10x overnight. Where do you look first?",
        a: "1) Check CPU/Memory load - if maxed out, scale horizontally. 2) Look at database: slow queries, connection pool exhaustion. 3) Check cache hit ratio - if dropped, increase Redis memory or warm cache. 4) Network latency - any packet loss? 5) Check downstream dependencies. 6) Review recent deployments - did code change? Use APM tool (DataDog/New Relic) to correlate all signals."
      },
      {
        q: "GC pause time jumped from 50ms to 800ms. Root cause?",
        a: "Full GC triggered by heap pressure. Check: 1) Heap usage - is it near max? 2) Young generation promotion rate - objects surviving too long. 3) Memory leak - heap grows monotonically? Solutions: increase heap size, switch to G1GC/ZGC (low latency), reduce object allocation, adjust NewRatio for young:old ratio tuning."
      },
      {
        q: "Database connection pool exhausted (100/100 active). What now?",
        a: "Immediate: Increase pool size temporarily. Investigation: Check slow query log - queries blocking connections. Check connection hold time (should be <1s). Review code for connection leaks (missing close()). Long-term: Set query timeouts, add monitoring alerts at 70% utilization, implement queue timeout in pool config, reduce pool size (ideal: 2x CPU cores), use prepared statements for faster execution."
      },
      {
        q: "Cache hit ratio dropped from 95% to 40% suddenly.",
        a: "Causes: 1) Eviction policy triggered (LRU/LFU running - memory full). Check Redis memory usage: INFO memory. 2) Aggressive TTL or cache invalidation bug. 3) New data patterns (different user segments). 4) Network partition to cache (read from stale replica). Solution: Increase Redis memory, review eviction policy, implement cache warming for hot keys, extend TTL if acceptable, check replication lag."
      },
      {
        q: "P99 latency is 5s but average is 100ms. How to debug?",
        a: "High percentile latency = tail latency spike. Check: 1) GC pauses - stop-the-world events. 2) Resource contention - one query locking many rows. 3) Cascading timeouts in microservices. 4) Hotspot partitions - one database shard handles 80% traffic. 5) Packet retransmission. Use distributed tracing with percentile views to isolate which service layer causes spikes. Add circuit breaker to fail fast."
      },
      {
        q: "Database replication lag is 500ms, reads get stale data. Solution?",
        a: "Route critical reads (user just updated) to master DB. Mark recently-updated records in cache (10s TTL). For normal reads, acceptable eventual consistency - read from replica. Implement version field: client stores version, waits for version bump before next read (ensures read-after-write consistency). Use read-through cache to mask replica lag. Monitor: SHOW SLAVE STATUS; check Seconds_Behind_Master."
      },
      {
        q: "One microservice is slow, blocking all others (cascading timeout).",
        a: "Service A calls B (50ms timeout) calls C (40ms timeout). If C slow → B times out → A times out → user sees 5s timeout. Solutions: 1) Set timeouts per service (50ms for internal calls, shorter for nested). 2) Add circuit breaker - fail fast after 5 consecutive failures instead of waiting. 3) Implement timeout budgets (don't exceed 100ms total). 4) Use async/queue to decouple. 5) Batch requests instead of sequential calls."
      },
      {
        q: "How do you monitor a system to catch slowness before users complain?",
        a: "3-pillar observability: 1) Metrics (Prometheus/Datadog) - p99 latency, error rate, CPU, GC pause. 2) Logs (ELK/Splunk) - query execution time, user_id, request path. 3) Traces (Jaeger/Zipkin) - end-to-end request flow across services. Set alerts: p99 > 500ms, error rate > 1%, GC pause > 100ms, DB connection pool > 80%. Use multi-metric correlation (not single alerts) to reduce false positives."
      },
      {
        q: "SAP Commerce flash sale - traffic spike expected 48h. How to prepare?",
        a: "Pre-event: Scale infrastructure (add 3-5x capacity). Cache catalog in Redis (read-heavy). Queue cart operations to Kafka (async processing). Separate payment processing queue (dedicated pool, rate limit). Batch inventory updates (10s window) to prevent race conditions. Feature flag non-critical features (recommendations, reviews). Monitor: CPU, memory, queue depth, connection pool, GC pause. Post-event: Gradually scale down, analyze bottlenecks."
      },
      {
        q: "How to correlate high latency across metrics, logs, and traces?",
        a: "Use trace ID linking: Every request gets unique trace ID. Same ID in all logs and trace spans. When p99 latency spike occurs: 1) Find p99 trace in Jaeger. 2) Note trace ID. 3) Search logs with same trace ID to find errors/warnings. 4) Check metrics at same timestamp - any resource spike? 5) Identify slowest span (which service). This 3-pillar correlation gives root cause in minutes instead of hours."
      },
      {
        q: "How to detect N+1 queries under high load?",
        a: "Symptoms: Query count grows with data set size. Detection: Enable slow query log (log_slow_queries). Query pattern analysis in APM tool (DataDog). Look for repeated queries like SELECT * FROM orders WHERE user_id = ? called 1000x in one transaction. Distributed tracing shows request timeline. Fix: 1) Fetch all at once with IN clause. 2) Use LEFT JOIN. 3) Add indexes on filter columns. 4) Implement caching for results."
      },
      {
        q: "Memory leak detected - heap keeps growing. How to find it?",
        a: "Tools: jstat -gc -h10 <pid> 1000 (watch heap growth). jmap -dump:live,format=b,file=heap.bin <pid> (heap dump). Eclipse MAT or YourKit (analyze dump). Find: 1) Static collections never cleared. 2) ThreadLocal not cleaned up. 3) Listeners not unregistered. 4) Cache without eviction. Check stack traces of largest objects in dump. Add memory leak fix + test case to prevent regression."
      },
      {
        q: "How to diagnose high CPU utilization (90%+)?",
        a: "Check: 1) User CPU vs System CPU (top -H). 2) Is it query processing or GC? (jstat -gc). 3) Which thread consuming CPU? (jstack <pid>). 4) Hot method profiling (JFR, YourKit). 5) Check for busy-wait loops (threads spinning). 6) Index missing causing full table scan? 7) Regex operations on large strings? Solutions: Add index, optimize code, reduce data set, scale horizontally, reduce algorithm complexity (O(n²) → O(n))."
      },
      {
        q: "What's the difference between latency spikes and consistent slowness?",
        a: "Latency spikes (p99 high, p50 normal): GC pause, network retransmit, hot partition spike. Fix: tune GC, add redundancy. Consistent slowness (all percentiles high): Resource exhaustion (CPU maxed, memory full, connection pool exhausted), inefficient query, missing index. Fix: scale hardware, optimize code/queries, add index. Diagnosis: Check if spike is temporary (logs show one event) or ongoing (metrics consistently high). Use histograms to see distribution, not just averages."
      }
    ]
  },
  {
    name: "Trade-offs",
    icon: "⚖️",
    questions: [
      {
        q: "Consistency vs Availability trade-off. Which to choose?",
        a: "CAP Theorem: Can't guarantee all 3 (Consistency, Availability, Partition tolerance). In network partition: choose CP (consistent) or AP (available). Payment system → CP (money can't disappear). Social media → AP (ok to miss some likes temporarily). Decision: 1) Network partitions inevitable. 2) Choose between stale data (AP) vs unavailable service (CP). Most systems choose AP + eventual consistency (Netflix, Amazon). Event sourcing + reconciliation loops achieve strong consistency in AP."
      },
      {
        q: "Strong consistency vs Eventual consistency. When use which?",
        a: "Strong consistency (ACID): Read always returns latest write. Latency higher (~50-100ms). Used for: payments, inventory, bank accounts. Eventual consistency: Reads may be stale for a time (seconds). Latency low (~5-10ms). Used for: user profiles, social feeds, comments. Decision factors: 1) Can users tolerate stale data? 2) What's business impact of inconsistency? 3) SLA requirement? Hybrid: Mix - strong for critical, eventual for non-critical."
      },
      {
        q: "Latency vs Throughput. How to optimize both?",
        a: "Latency: Time for single request (ms). Throughput: Requests per second (RPS). They conflict: Adding concurrency for throughput can increase tail latency. Solution: 1) Connection pooling for throughput without latency penalty. 2) Batching - aggregate 100 requests into 1 query (better throughput, slightly higher latency). 3) Async processing - queue jobs, return immediately. 4) Read replicas for read throughput. 5) Sharding for write throughput. 6) Caching for both. Measure p99 latency + RPS, not just averages."
      },
      {
        q: "Replication lag vs Write latency. How to balance?",
        a: "Synchronous replication: Slow (master waits for slave ack). Guaranteed durability. Write latency: 50-100ms. Asynchronous replication: Fast (master doesn't wait). Risk data loss on master crash. Write latency: 5-10ms. Compromise: Semi-sync (master waits for 1 of N replicas). For databases: Choose sync for financial, async for logging. For caches: Always async (can rebuild from source). Decision: Durability SLA vs Performance SLA."
      },
      {
        q: "Caching vs Correctness. How to keep data fresh?",
        a: "Cache-aside: Simple, fast, but stale data until TTL expires. Use for: user profiles (stale ok for 1 min). Write-through: Always fresh, slower writes. Use for: inventory (stale = overbooking). Event-based invalidation: Delete cache key on update (fresher, but complex). Cache versioning: Store version in cache, query DB if version mismatch. Decision: acceptable staleness window (1s? 1m? 1h?) + impact of stale data (money vs UX)."
      },
      {
        q: "Sharding vs Replication. When use each?",
        a: "Replication: Multiple copies of same data → better availability + read throughput. Sharding: Data split across servers → better write throughput + storage. 1M writes/sec: Need sharding. 1M reads/sec: Replication enough. Hot data (10GB) + 100GB storage: Shard for write capacity. Cold data read only: Replicate. Combined: Shard for writes, replicate each shard for availability. Example: Shard by user_id, each shard has 3 replicas (1 master, 2 slaves)."
      },
      {
        q: "Immediate consistency vs Eventual consistency in distributed DB.",
        a: "Immediate (strong): Every read sees latest write. Requires consensus protocol (Raft/Paxos). Latency 100ms+. Used by: PostgreSQL replicated, CockroachDB (geo-replicated). Eventual: Replicas catch up asynchronously. Latency 10ms+. Used by: DynamoDB, Cassandra, MongoDB (default). CAP: Immediate = CP. Eventual = AP. Hybrid: Google Cloud Spanner uses atomic clocks for strong consistency with low latency (95th %-ile 65ms)."
      },
      {
        q: "Vertical scaling vs Horizontal scaling. Trade-offs?",
        a: "Vertical (bigger machine): Easier, no code changes, but limits (can't buy infinite CPU). 10x cost → 2-3x performance. Horizontal (more machines): Complex (distributed systems hard), code must be stateless, but unlimited scale. Decision: Start vertical until hitting limits (~64 CPU, 256GB RAM), then switch horizontal. For Java: Vertical scale hits GC pause problems (long Full GC). Horizontal solves via partition (shard by user_id)."
      },
      {
        q: "Read-heavy vs Write-heavy system design difference.",
        a: "Read-heavy (10:1 read:write ratio): Cache heavily, multiple read replicas, denormalization ok. Write-heavy (1:10 read:write ratio): Queue writes (Kafka), batch processing, high write throughput DB (ShardedDB, Cassandra). Different bottlenecks: Read-heavy → network BW to cache/DB. Write-heavy → disk I/O for persistence. Hybrid: Separate read + write paths. Example: Write to queue → async batch process → update read cache. Order system (many reads, few writes) vs Analytics (many writes, few reads)."
      },
      {
        q: "Persistence vs Speed. Which to optimize?",
        a: "Durable write (sync to disk): Slow, safe. Latency 10-50ms. Used for: financial transactions, inventory. Fast write (in-memory, async persist): Quick, risky. Latency <5ms. Used for: cache, analytics, logs. Risk: Server crash = data loss. Compromise: Write-behind (fast return to client, async persist). SLA decision: How much data loss acceptable? <1 second? <1 hour? Trade cost (more hardware for both durability + speed) vs risk."
      },
      {
        q: "Denormalization vs Normalization in schema design.",
        a: "Normalized: Multiple JOINs to fetch related data. Slower (JOIN cost). Less storage (no duplication). Used: Transactional systems. Denormalized: Duplicate data in one table. Faster (no JOIN). More storage + stale data risk. Used: Analytical, cache. SAP Commerce: Denormalize cart total (redundant but fast checkout). Decision: 1) Is JOIN costly? (yes → denormalize). 2) Is data updated often? (no → safe to denormalize). 3) Can accept stale derived data? (yes → denormalize). Use materialized views for safe denormalization."
      },
      {
        q: "Synchronous RPC vs Asynchronous messaging for inter-service calls.",
        a: "RPC (REST/gRPC): Immediate response, simple. Latency: Low but adds up in cascades (A→B→C→D = 4 calls). Reliability: If B down, A fails. Async (Kafka/RabbitMQ): Decouple services, reliable (durable queue). Latency: Higher (queue processing delay). Reliability: B can be down, A unaffected. Decision: User-facing (checkout) → RPC (fast feedback). Backend jobs → Async (decouple). Hybrid: RPC for reads, async for writes (event-driven)."
      },
      {
        q: "Perfect consistency vs Performance under failures. How to choose?",
        a: "Perfect consistency (ACID transactions): Slow, available during normal operations. Breaks under high contention/failures. Performance under failures (BASE, eventual consistency): Fast, survives partitions. Accept temporary inconsistency. Most internet companies: Sacrifice perfect consistency for performance + resilience. Example: AWS DynamoDB allows eventual consistency for better performance. Decision: impact of <1% inconsistency vs downtime cost. Netflix: accepts eventual consistency."
      },
      {
        q: "Real-time response vs Batch processing. When each is better?",
        a: "Real-time (online): Immediate response to user. Latency <100ms. Cost: high (always-on servers). Used for: search, transactions, live feeds. Batch (offline): Process large volumes periodically. Latency: minutes/hours acceptable. Cost: low (run jobs at night). Used for: analytics, reports, recommendations. Decision: SLA latency requirement. 1-hour delay acceptable? → Batch. <1 second? → Real-time. Hybrid: Batch jobs populate cache, real-time reads from cache."
      },
      {
        q: "Strong typing (static) vs Dynamic typing in API design.",
        a: "Static (gRPC protobuf): Enforced schema, fast serialization, easy to detect breaking changes. Latency: 1ms (binary protocol). Maintenance: Schema versioning. Dynamic (REST JSON): Flexible, easier evolution. Latency: 5ms (string parsing). Risk: API version mismatch. Decision: Internal service → Static (gRPC, protobuf). Public API → Dynamic (REST, JSON, easier to extend). Java + SAP Commerce: Use gRPC internally for performance, REST externally for compatibility."
      }
    ]
  },
  {
    name: "Consistency & Eventual Consistency",
    icon: "🔄",
    questions: [
      {
        q: "Explain strong consistency vs eventual consistency with examples.",
        a: "Strong: Read always returns latest write. E.g., after transfer, checking balance always shows new amount. Database: PostgreSQL (ACID), MySQL InnoDB. Latency: 50-100ms (consensus overhead). Eventual: Reads may return stale data temporarily (seconds/minutes). E.g., YouTube views increment asynchronously. Database: DynamoDB, Cassandra. Latency: 5-10ms. Acceptable for: social media, analytics, recommendations. Unacceptable for: payments, inventory."
      },
      {
        q: "How to implement eventual consistency with read-after-write?",
        a: "Problem: User updates profile, reads get stale data from replica. Solution: 1) Mark recently-written keys in cache. 2) User updates → store write version in cache (10s TTL). 3) User reads → check cache. 4) If key in cache, read from master. Else read from replica. Code: cache.set('recentwrite:' + userId, version, 10s). 5) Next read: if cache hit → read from master. This ensures read-after-write consistency for user while benefiting from replica lag elsewhere."
      },
      {
        q: "How does versioning solve eventual consistency issues?",
        a: "Add version field (increment on each update). When user updates record: version 1 → version 2. User stores version 2. On read, client checks if version changed. If stale (version 1), wait/retry until version 2. Example: Order status v1 = pending, client waits for v2 (shipped). Helps: 1) Client knows when data stale. 2) Can trigger re-fetch if needed. 3) Concurrent update detection. Used in: optimistic locking, CRDTs (Conflict-free Replicated Data Types)."
      },
      {
        q: "Implement eventual consistency in distributed cache.",
        a: "Multi-region cache setup: Write to local cache → async replicate to other regions (Kafka event). Issue: Stale reads during propagation (100-500ms lag). Solutions: 1) Client-side cache versioning (track version from master write). 2) Event-based invalidation (publish cache-invalidate event). 3) TTL-based expiry (short TTL like 5s for eventual consistency). 4) Read-through pattern (check master on cache miss). Example: User profile update → write to master → async Kafka event → replicas update. During lag: reads get stale but accept it."
      },
      {
        q: "How to handle conflict resolution in eventual consistency?",
        a: "Problem: Two users update same record simultaneously in different datacenters → conflict. Resolutions: 1) Last-write-wins: timestamp ordering (simple, may lose data). 2) Version vector: track [dc1:v3, dc2:v2] (detect conflicts). 3) CRDTs (Conflict-free Replicated Data Types): automatic merge (like Google Docs). 4) Application logic: custom merge function (e.g., merge shopping carts by adding both items). Decision: Is conflict acceptable? (social media yes, payment no). CRDTs solve many conflicts automatically."
      },
      {
        q: "Explain CAP theorem in distributed systems.",
        a: "Consistency (C): All reads see latest write. Availability (A): System always responsive. Partition tolerance (P): Works despite network partitions. Trade-off: Can't have all 3. In partition: Choose CP (consistent but unavailable) or AP (available but inconsistent). Examples: 1) CP: PostgreSQL in single region (no partition = strong consistency). 2) AP: DynamoDB, Cassandra (available everywhere, eventual consistency). Most systems choose AP because partitions inevitable. Strong consistency needs coordination overhead."
      },
      {
        q: "How to achieve consistency in microservices?",
        a: "Microservices = inherent eventual consistency (decoupled systems). Guarantee consistency via: 1) Saga pattern: Multi-step transaction across services. E.g., order → reserve inventory → charge payment → ship. Compensating transactions on failure (credit payment if ship fails). 2) Event sourcing: Store all changes as events. Replay events to reconstruct current state. 3) 2-phase commit: Coordinator asks all services to prepare, then commit. (Blocking, not recommended). Saga is recommended for microservices (loose coupling, asynchronous)."
      },
      {
        q: "Implement saga pattern for distributed transaction.",
        a: "Order service: 1) Create order (pending). 2) Call inventory service → reserve items. 3) Call payment service → charge card. 4) Call shipping → dispatch. If any step fails, compensating transactions: If payment fails → release reserved items. If shipping fails → refund payment + release items. Implementation: Orchestration (order service orchestrates) vs Choreography (services trigger via events). Choreography preferred (loosely coupled). Tools: Temporal, Kafka events. Risk: Partial failures are complex to handle."
      },
      {
        q: "How to monitor consistency in eventually consistent system?",
        a: "Monitor: 1) Replication lag (Seconds_Behind_Master). Alert if >10s. 2) Write-read lag (time from write to readable replica). 3) Event queue depth (how many messages not yet processed). 4) Reconciliation job failures (if you periodically check for consistency). 5) Business metrics divergence (e.g., total inventory across replicas). Use: Datadog, CloudWatch, Prometheus. Set alert if replica lag exceeds acceptable threshold (e.g., 30s). Periodic audit: Run reconciliation query, fix discrepancies."
      },
      {
        q: "Implement read-through cache with eventual consistency.",
        a: "Pattern: 1) Read request comes → check cache. 2) Cache miss → read from DB → store in cache (TTL 60s) → return. 3) If cache stale (TTL expired) and DB has new data, next read fetches fresh. Eventual consistency: Reads are stale within TTL window. Setup: cache.get(key) → if null: db.get(key) → cache.set(key, value, 60s TTL). Benefit: Fast reads + handles DB slow. Issue: <5 min staleness acceptable for: user profiles, product catalog. Unacceptable for: payment confirmation."
      },
      {
        q: "How does multi-master replication work with eventual consistency?",
        a: "Setup: Multiple datacenters, each has writable master. Write locally (fast), async replicate to other masters. Advantage: Low latency (no remote master wait). Disadvantage: Conflict risk (concurrent writes to different masters). Resolution: Last-write-wins, version vectors, CRDTs. Example: DynamoDB with global secondary indexes. Challenges: Split-brain (datacenters partitioned, both think they're the master). Solution: Quorum writes (require majority ack before confirming write). Trade: Latency for consistency."
      },
      {
        q: "Implement event-based eventual consistency.",
        a: "Architecture: 1) Service A writes to DB + publishes event (OrderCreated). 2) Kafka durably stores event. 3) Service B subscribes, processes event asynchronously. 4) Updates its own state. Consistency achieved: Services synchronized via events. If B crashes, replays events on restart. Ordering: Single partition per stream entity (order_id) ensures FIFO ordering. Guarantee: At-least-once delivery (B may process twice, needs idempotency). Implementation: Spring Boot + Kafka + @KafkaListener. Advantage: Decoupled, resilient. Disadvantage: Debugging (distributed, async)."
      },

function showTopic(index) {
  document.getElementById('mindmapView').style.display = 'none';
  const view = document.getElementById('qaView');
  view.classList.add('active');
  
  const topic = topics[index];
  document.getElementById('qaTitle').textContent = topic.name;
  
  const container = document.getElementById('qaContainer');
  container.innerHTML = '';
  
  topic.questions.forEach((qa, idx) => {
    const div = document.createElement('div');
    div.className = 'qa-pair';
    div.innerHTML = `
      <div class="question">
        <span class="qa-number">${idx + 1}</span>
        <div class="center-content">
          <span>${qa.q}</span>
          <span class="toggle-icon">▼</span>
        </div>
      </div>
      <div class="answer">${qa.a}</div>
    `;
    
    div.addEventListener('click', function() {
      this.classList.toggle('expanded');
    });
    
    container.appendChild(div);
  });
}

function showMindmap() {
  document.getElementById('mindmapView').style.display = 'grid';
  document.getElementById('qaView').classList.remove('active');
}
