<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Polymorphism - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.4em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>🎭 Polymorphism</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_master_index.html" class="back-link">← Back to Master Index</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "What is Polymorphism?",
                content: `<div class="content-header"><h2>1. What is Polymorphism?</h2><p>One name, many forms</p></div>
                <div class="content-body"><p><strong>Polymorphism:</strong> Ability of an object to take multiple forms. One interface, many implementations.</p>
                <p><strong>Real-world example:</strong> A person can be a student, employee, parent - same person, multiple roles.</p>
                <p><strong>Two types:</strong></p><ul><li>Compile-time Polymorphism (Static)</li><li>Runtime Polymorphism (Dynamic)</li></ul></div>`
            },
            {
                id: 2,
                title: "Compile-time Polymorphism (Method Overloading)",
                content: `<div class="content-header"><h2>2. Compile-time Polymorphism</h2><p>Resolved at compilation time</p></div>
                <div class="content-body"><p><strong>Method Overloading:</strong> Same method name, different parameters</p>
                <div class="code-block">class Calculator {
    public int add(int a, int b) { return a + b; }
    public double add(double a, double b) { return a + b; }
    public int add(int a, int b, int c) { return a + b + c; }
}</div>
                <p><strong>Overloading rules:</strong></p><ul><li>Same method name</li><li>Different parameter list (type, number, order)</li><li>Can have different return type (doesn't matter)</li><li>Can have different access modifier</li></ul>
                <p><strong>Which method is called?</strong> Determined by argument types at compile time.</p></div>`
            },
            {
                id: 3,
                title: "Runtime Polymorphism (Method Overriding)",
                content: `<div class="content-header"><h2>3. Runtime Polymorphism</h2><p>Resolved at runtime</p></div>
                <div class="content-body"><p><strong>Method Overriding:</strong> Child class provides implementation of parent's method</p>
                <div class="code-block">class Animal {
    void sound() { System.out.println("Some sound"); }
}

class Dog extends Animal {
    @Override
    void sound() { System.out.println("Bark"); }
}

class Cat extends Animal {
    @Override
    void sound() { System.out.println("Meow"); }
}</div>
                <p><strong>Virtual method invocation:</strong></p>
                <div class="code-block">Animal animal = new Dog();  // Parent reference, child object
animal.sound();  // Calls Dog's sound() at runtime!</div></div>`
            },
            {
                id: 4,
                title: "Upcasting & Dynamic Binding",
                content: `<div class="content-header"><h2>4. Upcasting & Dynamic Binding</h2><p>Key to achieving runtime polymorphism</p></div>
                <div class="content-body"><p><strong>Upcasting:</strong> Assigning child object to parent reference</p>
                <div class="code-block">Animal animal = new Dog();  // Upcasting (automatic)</div>
                <p><strong>Dynamic Binding:</strong> JVM decides which method to call at runtime based on actual object type</p>
                <div class="code-block">Animal dog = new Dog();
Animal cat = new Cat();

dog.sound();  // Calls Dog.sound() - resolved at runtime!
cat.sound();  // Calls Cat.sound() - resolved at runtime!</div>
                <div class="tip">The reference type is Animal, but the actual object type determines which method is executed.</div></div>`
            },
            {
                id: 5,
                title: "Constructor Overloading",
                content: `<div class="content-header"><h2>5. Constructor Overloading</h2><p>Providing multiple ways to create objects</p></div>
                <div class="content-body"><div class="code-block">class Person {
    private String name;
    private int age;

    public Person() {}  // Default constructor

    public Person(String name) {
        this.name = name;
    }

    public Person(String name, int age) {
        this.name = name;
        this.age = age;
    }
}</div>
                <p><strong>Usage:</strong></p>
                <div class="code-block">Person p1 = new Person();
Person p2 = new Person("John");
Person p3 = new Person("John", 25);</div></div>`
            },
            {
                id: 6,
                title: "Interface-based Polymorphism",
                content: `<div class="content-header"><h2>6. Interface-based Polymorphism</h2><p>Most flexible form of polymorphism</p></div>
                <div class="content-body"><div class="code-block">interface Shape {
    void draw();
}

class Circle implements Shape {
    @Override
    public void draw() { System.out.println("Drawing Circle"); }
}

class Rectangle implements Shape {
    @Override
    public void draw() { System.out.println("Drawing Rectangle"); }
}

Shape shape = new Circle();
shape.draw();  // Polymorphic call</div>
                <div class="tip">Interfaces provide maximum flexibility because a class can implement multiple interfaces but can only extend one class.</div></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
