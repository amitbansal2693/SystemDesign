<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 8 Functional Interface - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.3em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>🎯 Functional Interface</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java8_topics_index.html" class="back-link">← Back to Java 8</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "What is Functional Interface?",
                content: `<div class="content-header"><h2>1. What is Functional Interface?</h2><p>Interface with exactly one abstract method</p></div>
                <div class="content-body"><p><strong>Definition:</strong> An interface with ONLY ONE abstract method (SAM = Single Abstract Method)</p>
                <p><strong>Requirements:</strong></p><ul><li>Exactly 1 abstract method</li><li>Can have multiple default methods</li><li>Can have static methods</li><li>Can have multiple static final constants</li></ul>
                <div class="code-block">@FunctionalInterface
public interface MyFunction {
    int calculate(int a, int b);  // One abstract method

    // Allowed:
    default void display() {}
    static void show() {}
}</div></div>`
            },
            {
                id: 2,
                title: "@FunctionalInterface Annotation",
                content: `<div class="content-header"><h2>2. @FunctionalInterface Annotation</h2><p>Mark interface as functional</p></div>
                <div class="content-body"><p><strong>Purpose:</strong> Compiler checks that interface follows rules</p>
                <div class="code-block">@FunctionalInterface
public interface MyCalc {
    int add(int a, int b);
}

// Compilation error - violates rules:
@FunctionalInterface
public interface BadInterface {
    void method1();
    void method2();  // ❌ More than one abstract method!
}</div>
                <p><strong>Benefits:</strong></p><ul><li>Compiler verification</li><li>Clear intent</li><li>Documentation</li></ul></div>`
            },
            {
                id: 3,
                title: "Built-in Functional Interfaces",
                content: `<div class="content-header"><h2>3. Built-in Functional Interfaces</h2><p>Java 8 provides common ones</p></div>
                <div class="content-body"><p><strong>Consumer&lt;T&gt;:</strong> Accepts but returns nothing</p>
                <div class="code-block">Consumer<String> print = s -> System.out.println(s);
print.accept("Hello");</div>
                <p><strong>Supplier&lt;T&gt;:</strong> Returns something, no input</p>
                <div class="code-block">Supplier<Integer> counter = () -> 42;
int val = counter.get();</div>
                <p><strong>Function&lt;T, R&gt;:</strong> Takes T, returns R</p>
                <div class="code-block">Function<Integer, String> toString = n -> "Num: " + n;
String result = toString.apply(42);</div>
                <p><strong>Predicate&lt;T&gt;:</strong> Returns boolean</p>
                <div class="code-block">Predicate<String> isEmpty = s -> s.isEmpty();
boolean empty = isEmpty.test("");</div></div>`
            },
            {
                id: 4,
                title: "Lambda & Functional Interface",
                content: `<div class="content-header"><h2>4. Lambda & Functional Interface</h2><p>Why lambda needs functional interfaces</p></div>
                <div class="content-body"><p><strong>Connection:</strong> Lambda implements functional interface's single abstract method</p>
                <div class="code-block">@FunctionalInterface
interface Multiplier {
    int multiply(int a, int b);
}

// Lambda implements the multiply method
Multiplier m = (a, b) -> a * b;
System.out.println(m.multiply(3, 4));  // Output: 12</div>
                <div class="tip">Lambda expressions ONLY work with functional interfaces having exactly one abstract method.</div></div>`
            },
            {
                id: 5,
                title: "Custom Functional Interfaces",
                content: `<div class="content-header"><h2>5. Custom Functional Interfaces</h2><p>Create your own functional interfaces</p></div>
                <div class="content-body"><div class="code-block">@FunctionalInterface
public interface StringOperation {
    String process(String input);

    default String withPrefix(String s) {
        return "PREFIX: " + process(s);
    }
}

// Usage
StringOperation uppercase = s -> s.toUpperCase();
System.out.println(uppercase.process("hello"));
System.out.println(uppercase.withPrefix("hello"));</div></div>`
            },
            {
                id: 6,
                title: "Real-World Usage",
                content: `<div class="content-header"><h2>6. Real-World Usage</h2><p>Practical examples in frameworks</p></div>
                <div class="content-body"><p><strong>Spring Framework:</strong> @FunctionalInterface patterns</p>
                <p><strong>Reactive Programming:</strong> Many reactive libraries use SAM interfaces</p>
                <p><strong>JSON Libraries:</strong> Callback handlers via functional interfaces</p>
                <p><strong>Collections API:</strong> sort(), filter() with lambda</p>
                <div class="tip">Most modern Java frameworks heavily use functional interfaces with lambda expressions.</div></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
