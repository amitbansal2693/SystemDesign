<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Interview Questions v2</title>
<style>
:root {
  --surface-0: #fafafa;
  --surface-1: #f0f0f0;
  --surface-2: #ffffff;
  --border: #e0e0e0;
  --border-strong: #bbb;
  --text-primary: #1a1a1a;
  --text-secondary: #555;
  --fill-accent: #2563eb;
  --on-accent: #fff;
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--surface-0); color: var(--text-primary); }

.container { max-width: 920px; margin: 0 auto; padding: 2rem 1rem; }

.header { text-align: center; margin-bottom: 2rem; }
.header h1 { font-size: 28px; font-weight: 500; margin-bottom: 0.5rem; }
.header p { color: var(--text-secondary); font-size: 14px; }

.mindmap-view { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

.topic-card {
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-height: 120px;
  justify-content: center;
}

.topic-card:hover {
  border-color: var(--fill-accent);
  background: var(--surface-1);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(37,99,235,0.12);
}

.topic-icon { font-size: 28px; display: inline-block; }
.topic-name { font-weight: 500; font-size: 14px; line-height: 1.3; }

.qa-view { display: none; }
.qa-view.active { display: block; }

.qa-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--border);
}

.back-btn {
  background: none;
  border: 0.5px solid var(--border);
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-primary);
  font-size: 14px;
  transition: all 0.2s;
}

.back-btn:hover { background: var(--surface-1); border-color: var(--border-strong); }

.qa-title { font-size: 24px; font-weight: 500; }

.qa-container { display: flex; flex-direction: column; gap: 16px; }

.qa-pair {
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.qa-pair:hover { border-color: var(--border-strong); background: var(--surface-1); }
.qa-pair.expanded { border-color: var(--fill-accent); }

.qa-number {
  display: inline-block;
  background: var(--fill-accent);
  color: var(--on-accent);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  text-align: center;
  line-height: 28px;
  font-size: 12px;
  font-weight: 500;
  margin-right: 8px;
  flex-shrink: 0;
}

.question {
  font-weight: 500;
  font-size: 15px;
  color: var(--text-primary);
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.7;
  padding-left: 36px;
}

.qa-pair.expanded .answer {
  max-height: 8000px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
}

.toggle-icon {
  display: inline-block;
  transition: transform 0.3s;
  margin-left: auto;
  flex-shrink: 0;
}

.qa-pair.expanded .toggle-icon { transform: rotate(180deg); }

.center-content {
  display: flex;
  gap: 12px;
  align-items: center;
  width: 100%;
}

/* ── Answer formatting ── */
.answer h4 {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
  margin: 14px 0 6px 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.answer h4:first-child { margin-top: 0; }

.answer p { margin: 6px 0; }

.answer ul {
  list-style: none;
  margin: 6px 0;
  padding: 0;
}

.answer ul li {
  position: relative;
  padding: 4px 0 4px 18px;
}

.answer ul li::before {
  content: "•";
  position: absolute;
  left: 2px;
  color: var(--fill-accent);
  font-weight: bold;
}

.answer .flow-chart {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 10px 0;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12.5px;
  line-height: 1.8;
  white-space: pre;
  overflow-x: auto;
  color: var(--text-primary);
}

.answer .mindmap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}

.answer .mindmap .node {
  background: var(--fill-accent);
  color: white;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  display: inline-block;
}

.answer .mindmap .node.alt { background: #7c3aed; }
.answer .mindmap .node.green { background: #16a34a; }
.answer .mindmap .node.orange { background: #ea580c; }
.answer .mindmap .node.red { background: #dc2626; }

.answer .badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  vertical-align: middle;
  margin-right: 4px;
}

.answer .badge-blue { background: #dbeafe; color: #1d4ed8; }
.answer .badge-green { background: #dcfce7; color: #15803d; }
.answer .badge-red { background: #fee2e2; color: #dc2626; }
.answer .badge-orange { background: #ffedd5; color: #c2410c; }
.answer .badge-purple { background: #f3e8ff; color: #7c3aed; }

.answer .tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  margin: 10px 0;
}
.answer .tbl th {
  background: var(--fill-accent);
  color: white;
  padding: 7px 10px;
  text-align: left;
  font-weight: 500;
}
.answer .tbl td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
}
.answer .tbl tr:hover td { background: #f5f5f5; }

.answer .tip {
  background: #eff6ff;
  border-left: 3px solid var(--fill-accent);
  padding: 8px 12px;
  margin: 10px 0;
  border-radius: 0 6px 6px 0;
  font-size: 13px;
}

.answer .warn {
  background: #fef3c7;
  border-left: 3px solid #f59e0b;
  padding: 8px 12px;
  margin: 10px 0;
  border-radius: 0 6px 6px 0;
  font-size: 13px;
}

.answer code {
  background: #f1f5f9;
  padding: 1px 5px;
  border-radius: 3px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
}

.answer .interview-answer {
  background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
  border: 1px solid #bbf7d0;
  border-left: 4px solid #22c55e;
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #1a1a1a;
  font-style: italic;
}

.answer .interview-answer::before {
  content: "🎤 Interview Answer: ";
  font-style: normal;
  font-weight: 600;
  color: #16a34a;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>System Design Interview Questions</h1>
    <p>Navigate through 10 core topics · Click to explore Q&A pairs · v2 — Improved formatting</p>
  </div>

  <div class="mindmap-view" id="mindmapView">
    <div class="topic-card" onclick="showTopic(0)"><span class="topic-icon">🐌</span><span class="topic-name">Slowness & Diagnosis</span></div>
    <div class="topic-card" onclick="showTopic(1)"><span class="topic-icon">⚖️</span><span class="topic-name">Trade-offs</span></div>
    <div class="topic-card" onclick="showTopic(2)"><span class="topic-icon">🔄</span><span class="topic-name">Consistency</span></div>
    <div class="topic-card" onclick="showTopic(3)"><span class="topic-icon">🌐</span><span class="topic-name">Service-to-Service</span></div>
    <div class="topic-card" onclick="showTopic(4)"><span class="topic-icon">⚡</span><span class="topic-name">Load Balancer</span></div>
    <div class="topic-card" onclick="showTopic(5)"><span class="topic-icon">🔒</span><span class="topic-name">Concurrency</span></div>
    <div class="topic-card" onclick="showTopic(6)"><span class="topic-icon">💾</span><span class="topic-name">Cache</span></div>
    <div class="topic-card" onclick="showTopic(7)"><span class="topic-icon">📢</span><span class="topic-name">Event-based</span></div>
    <div class="topic-card" onclick="showTopic(8)"><span class="topic-icon">🔐</span><span class="topic-name">Authorization</span></div>
    <div class="topic-card" onclick="showTopic(9)"><span class="topic-icon">⏱️</span><span class="topic-name">Latency</span></div>
  </div>

  <div class="qa-view" id="qaView">
    <div class="qa-header">
      <button class="back-btn" onclick="showMindmap()">← Back</button>
      <span id="qaTitle" class="qa-title"></span>
    </div>
    <div class="qa-container" id="qaContainer"></div>
  </div>
</div>

<script>
const topics = [
  // ─── 0: SLOWNESS & DIAGNOSIS ───
  {
    name: "Slowness & Diagnosis",
    icon: "🐌",
    questions: [
      {
        q: "How do you detect system slowness when traffic doubles?",
        a: `<div class="interview-answer">When traffic doubles, I would immediately look at key metrics across all layers. For example, if our e-commerce API response time jumps from 50ms to 500ms, I'd check CPU and memory first — if CPU is at 90%, we need to scale horizontally. Then I'd check the database — are queries slow because the connection pool is exhausted? Then cache — did the hit ratio drop from 95% to 60%? I'd use a tool like DataDog to correlate all these signals at the same timestamp to pinpoint the bottleneck layer.</div>
<h4>📊 Metrics to Monitor</h4>
<div class="mindmap">
  <span class="node">Response Time p50/p95/p99</span>
  <span class="node alt">Error Rate</span>
  <span class="node green">CPU >70%</span>
  <span class="node orange">Memory</span>
  <span class="node red">GC Pause</span>
  <span class="node">Network Latency</span>
  <span class="node alt">DB Query Time</span>
  <span class="node green">Cache Hit Ratio</span>
  <span class="node orange">Connection Pool</span>
</div>
<h4>🔍 By Layer</h4>
<ul>
  <li><b>Application:</b> Response time (p50, p95, p99), Error rate, Throughput (RPS)</li>
  <li><b>JVM (Java):</b> GC pause time, Heap usage, Thread count, GC frequency</li>
  <li><b>Infrastructure:</b> CPU (>70% warning), Memory, Network latency, Packet loss</li>
  <li><b>Database:</b> Query execution time, Connection pool exhaustion, Lock wait time</li>
  <li><b>Cache:</b> Hit ratio drop, Eviction rate, Latency spike</li>
</ul>
<h4>✅ Action Plan</h4>
<ul>
  <li>Set alerts at <b>60-70% threshold</b></li>
  <li>Use <b>distributed tracing</b> to identify bottleneck layer</li>
</ul>`
      },
      {
        q: "Traffic spiked 10x overnight. Where do you look first?",
        a: `<div class="interview-answer">I would follow a top-down approach. For example, if our order service got 10x traffic overnight, I'd first check if CPU/memory are maxed — if yes, trigger auto-scaling. If not, I'd check the database for slow queries and connection pool exhaustion. Then the cache hit ratio — a drop from 95% to 40% means Redis might be evicting keys. Then network and downstream dependencies. Finally, I'd check if someone deployed new code that night. The key is correlating all signals using an APM tool, not looking at one metric in isolation.</div>
<h4>🔢 Step-by-Step</h4>
<div class="flow-chart">User Request
    ↓
┌───────────────────────────────────────┐
│ 1️⃣  CPU / Memory → maxed out?         │
│    YES → Scale horizontally           │
│    NO  ↓                              │
│ 2️⃣  Database → slow queries?          │
│    Check connection pool exhaustion   │
│    NO  ↓                              │
│ 3️⃣  Cache → hit ratio dropped?        │
│    Increase Redis memory / warm cache │
│    NO  ↓                              │
│ 4️⃣  Network → packet loss?            │
│    NO  ↓                              │
│ 5️⃣  Downstream dependencies slow?     │
│    NO  ↓                              │
│ 6️⃣  Recent deployment → code change?  │
└───────────────────────────────────────┘</div>
<div class="tip">💡 Use APM tool (DataDog / New Relic) to correlate all signals simultaneously</div>`
      },
      {
        q: "GC pause time jumped from 50ms to 800ms. Root cause?",
        a: `<div class="interview-answer">This is almost certainly a Full GC triggered by heap pressure. For example, in one of our Java services, the heap was set to 4GB and the live data set grew to 3.8GB after a data migration. The JVM kept triggering Full GC every few seconds, pausing the app for 800ms each time. We fixed it by increasing heap to 8GB short-term, then switched from Parallel GC to G1GC which keeps pauses under 100ms. We also found a static HashMap that was never cleared — a classic memory leak.</div>
<h4>🔴 Root Cause</h4>
<p><b>Full GC</b> triggered by heap pressure</p>
<h4>🔍 Diagnosis Checklist</h4>
<ul>
  <li>Heap usage — is it near max?</li>
  <li>Young generation promotion rate — objects surviving too long</li>
  <li>Memory leak — heap grows monotonically?</li>
</ul>
<h4>🛠️ Solutions</h4>
<table class="tbl">
  <tr><th>Action</th><th>When</th></tr>
  <tr><td>Increase heap size</td><td>If heap near max & pauses short</td></tr>
  <tr><td>Switch to G1GC / ZGC</td><td>Low-latency requirements</td></tr>
  <tr><td>Reduce object allocation</td><td>Too many short-lived objects</td></tr>
  <tr><td>Adjust <code>-XX:NewRatio=2</code></td><td>Young:Old ratio tuning</td></tr>
</table>`
      },
      {
        q: "Database connection pool exhausted (100/100 active). What now?",
        a: `<div class="interview-answer">First, I'd increase the pool size temporarily to stop the bleeding — say from 100 to 150. But that's a band-aid. The real investigation starts with the slow query log. For example, we once had a report query doing a full table scan on a 50M-row table, holding connections for 30 seconds each. That alone blocked 20 connections. We added an index, the query dropped to 5ms, and pool usage went back to 30%. Long-term, I'd set the pool size to about 2× CPU cores, add query timeouts, and alert at 70% utilization.</div>
<h4>🚨 Immediate</h4>
<ul><li>Increase pool size temporarily</li></ul>
<h4>🔍 Investigation</h4>
<ul>
  <li>Check <b>slow query log</b> — queries blocking connections</li>
  <li>Check <b>connection hold time</b> (should be &lt;1s)</li>
  <li>Review code for <b>connection leaks</b> (missing <code>close()</code>)</li>
</ul>
<h4>🛠️ Long-term Fixes</h4>
<ul>
  <li>Set query timeouts</li>
  <li>Add monitoring alerts at 70% utilization</li>
  <li>Implement queue timeout in pool config</li>
  <li>Reduce pool size (ideal: <b>2× CPU cores</b>)</li>
  <li>Use prepared statements</li>
</ul>`
      },
      {
        q: "Cache hit ratio dropped from 95% to 40% suddenly.",
        a: `<div class="interview-answer">A sudden drop like this usually means one of four things. For example, we had a Redis instance running at 6GB with maxmemory set to 6GB. A new marketing campaign brought in a different user segment, increasing the working set. Redis started evicting keys aggressively via LRU, and our hit ratio tanked. The fix was to increase Redis memory to 10GB and pre-warm the cache with the new popular products. I always check INFO memory first, then eviction policy, then look for any recent invalidation logic changes.</div>
<h4>🔍 Possible Causes</h4>
<ul>
  <li><span class="badge badge-red">1</span> <b>Eviction triggered</b> — LRU/LFU running (memory full). Check: <code>INFO memory</code></li>
  <li><span class="badge badge-orange">2</span> <b>Aggressive TTL</b> or cache invalidation bug</li>
  <li><span class="badge badge-blue">3</span> <b>New data patterns</b> — traffic spike with different user segments</li>
  <li><span class="badge badge-purple">4</span> <b>Network partition</b> — reading from stale replica</li>
</ul>
<h4>✅ Fixes</h4>
<ul>
  <li>Increase Redis memory</li>
  <li>Review eviction policy</li>
  <li>Implement <b>cache warming</b> for hot keys</li>
  <li>Extend TTL if acceptable</li>
  <li>Check replication lag</li>
</ul>`
      },
      {
        q: "P99 latency is 5s but average is 100ms. How to debug?",
        a: `<div class="interview-answer">The average looks fine at 100ms, but 1% of our users are waiting 5 seconds — that's terrible. In our order service, we traced a p99 spike to GC pauses. Most requests finished in 50ms, but every 10 seconds a Full GC paused the JVM for 3 seconds, hitting exactly 1% of requests. We switched to ZGC and p99 dropped to 200ms. I always use distributed tracing with percentile breakdown, not averages — averages hide these tail latency problems completely.</div>
<h4>📌 What This Means</h4>
<p>High percentile latency = <b>tail latency spike</b> (99% fine, 1% very slow)</p>
<h4>🔍 Check These</h4>
<ul>
  <li><b>GC pauses</b> — stop-the-world events</li>
  <li><b>Resource contention</b> — one query locking many rows</li>
  <li><b>Cascading timeouts</b> — microservices waiting on each other</li>
  <li><b>Hotspot partitions</b> — one DB shard handles 80% traffic</li>
  <li><b>Packet retransmission</b> — network-level delays</li>
</ul>
<h4>✅ Action</h4>
<ul>
  <li>Use <b>distributed tracing</b> with percentile views</li>
  <li>Add <b>circuit breaker</b> to fail fast</li>
</ul>`
      },
      {
        q: "Database replication lag is 500ms, reads get stale data. Solution?",
        a: `<div class="interview-answer">I'd use a read-after-write consistency pattern. For example, when a user updates their profile, I write to master and also set a flag in Redis like "recently_updated:user123" with a 10-second TTL. On the next read, if this flag exists, I route to master instead of the replica. For all other reads where the user hasn't just written, I'm happy to read from the replica — 500ms staleness is acceptable for browsing product pages. This way, we get the best of both worlds: consistency for the writing user, and performance for everyone else.</div>
<h4>🛠️ Architecture</h4>
<div class="flow-chart">User writes data
    ↓
Master DB (write) ──→ Replica (async, 500ms lag)
    ↓
Mark in cache: recently_updated:userId (10s TTL)
    ↓
On next READ:
  ├─ Cache hit → Read from MASTER ✅
  └─ Cache miss → Read from REPLICA (stale ok) ✅</div>
<h4>📋 Strategies</h4>
<ul>
  <li><b>Critical reads:</b> Route to master (user just updated)</li>
  <li><b>Normal reads:</b> Acceptable eventual consistency — read from replica</li>
  <li><b>Version field:</b> Client stores version, waits for bump</li>
  <li><b>Read-through cache:</b> Mask replica lag</li>
</ul>
<div class="tip">💡 Monitor: <code>SHOW SLAVE STATUS</code> → check <code>Seconds_Behind_Master</code></div>`
      },
      {
        q: "One microservice is slow, blocking all others (cascading timeout).",
        a: `<div class="interview-answer">This is the classic cascading failure. For example, our checkout service calls payment, inventory, and shipping. When the payment provider went slow (5s response), checkout waited 5s, then inventory timed out too because checkout was already holding threads. The entire chain collapsed. We fixed it by adding a circuit breaker on the payment call — after 5 failures, it opens and fails fast in 100ms instead of waiting 5s. We also added per-service timeouts: payment gets 200ms, inventory 100ms, with a total budget of 500ms.</div>
<h4>🔴 The Problem</h4>
<div class="flow-chart">Service A (50ms timeout)
    ↓ calls
Service B (50ms timeout)
    ↓ calls
Service C (slow! 💥)
    ↓
B times out → A times out → User sees 5s</div>
<h4>🛠️ Solutions</h4>
<ul>
  <li><span class="badge badge-blue">1</span> <b>Timeouts per service</b> — 50ms for internal calls</li>
  <li><span class="badge badge-green">2</span> <b>Circuit breaker</b> — fail fast after 5 consecutive failures</li>
  <li><span class="badge badge-orange">3</span> <b>Timeout budgets</b> — don't exceed 100ms total</li>
  <li><span class="badge badge-purple">4</span> <b>Async / queue</b> — decouple services</li>
  <li><span class="badge badge-red">5</span> <b>Batch requests</b> instead of sequential</li>
</ul>`
      },
      {
        q: "How do you monitor a system to catch slowness before users complain?",
        a: `<div class="interview-answer">I rely on three pillars: metrics, logs, and traces. For example, I set up Prometheus to track p99 latency for every endpoint, ELK for structured logging with request IDs, and Jaeger for distributed tracing. I set alerts at p99 > 500ms and error rate > 1%. The key is multi-metric correlation — if p99 spikes AND GC pause increases AND DB connection pool usage jumps, I know it's a heap pressure problem, not a network issue. Without correlating metrics, you chase ghosts.</div>
<h4>🏛️ 3-Pillar Observability</h4>
<div class="mindmap">
  <span class="node">📊 Metrics</span>
  <span class="node alt">📝 Logs</span>
  <span class="node green">🔗 Traces</span>
</div>
<table class="tbl">
  <tr><th>Pillar</th><th>Tool</th><th>What to Track</th></tr>
  <tr><td><b>Metrics</b></td><td>Prometheus / Datadog</td><td>p99 latency, error rate, CPU, GC pause</td></tr>
  <tr><td><b>Logs</b></td><td>ELK / Splunk</td><td>Query time, user_id, request path</td></tr>
  <tr><td><b>Traces</b></td><td>Jaeger / Zipkin</td><td>End-to-end request flow</td></tr>
</table>
<h4>🚨 Alert Thresholds</h4>
<ul>
  <li>P99 latency &gt; 500ms</li>
  <li>Error rate &gt; 1%</li>
  <li>GC pause &gt; 100ms</li>
  <li>DB connection pool &gt; 80%</li>
</ul>
<div class="tip">💡 Use <b>multi-metric correlation</b> (not single alerts) to reduce false positives</div>`
      },
      {
        q: "SAP Commerce flash sale - traffic spike expected 48h. How to prepare?",
        a: `<div class="interview-answer">24 hours before the sale, I'd pre-scale infrastructure to 3-5x capacity — don't wait for auto-scaling to react. For example, before a Black Friday sale, we cached the entire product catalog in Redis since it's read-heavy, queued all cart operations through Kafka to handle write bursts, and separated payment processing into a dedicated pool with its own rate limiter. We also feature-flagged recommendations and reviews to free up resources. During the event, we monitored CPU, queue depth, and connection pools every 30 seconds.</div>
<h4>⏰ Pre-Event (24h Before)</h4>
<ul>
  <li>Scale infrastructure (<b>3-5× capacity</b>)</li>
  <li>Cache catalog in Redis (read-heavy)</li>
  <li>Queue cart operations to Kafka (async)</li>
  <li>Separate payment queue (dedicated pool, rate limit)</li>

function showTopic(index) {
  document.getElementById('mindmapView').style.display = 'none';
  const view = document.getElementById('qaView');
  view.classList.add('active');
  const topic = topics[index];
  document.getElementById('qaTitle').textContent = topic.icon + ' ' + topic.name;
  const container = document.getElementById('qaContainer');
  container.innerHTML = '';
  topic.questions.forEach((qa, idx) => {
    const div = document.createElement('div');
    div.className = 'qa-pair';
    div.innerHTML = `
      <div class="question">
        <span class="qa-number">${idx + 1}</span>
        <div class="center-content">
          <span>${qa.q}</span>
          <span class="toggle-icon">▼</span>
        </div>
      </div>
      <div class="answer">${qa.a}</div>`;
    div.addEventListener('click', function() { this.classList.toggle('expanded'); });
    container.appendChild(div);
  });
}

function showMindmap() {
  document.getElementById('mindmapView').style.display = 'grid';
  document.getElementById('qaView').classList.remove('active');
}
