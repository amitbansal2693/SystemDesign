<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Clone - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.4em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>📋 Clone</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_master_index.html" class="back-link">← Back to Master Index</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "Cloneable Interface",
                content: `<div class="content-header"><h2>1. Cloneable Interface</h2><p>The marker interface for cloning</p></div>
                <div class="content-body"><p><strong>Cloneable:</strong> A marker interface that signals an object can be cloned.</p>
                <div class="code-block">public interface Cloneable {
    // Empty interface - just a marker
}</div>
                <p><strong>To enable cloning:</strong></p>
                <div class="code-block">public class Person implements Cloneable {
    public Object clone() throws CloneNotSupportedException {
        return super.clone();
    }
}</div></div>`
            },
            {
                id: 2,
                title: "Shallow Clone",
                content: `<div class="content-header"><h2>2. Shallow Clone</h2><p>Copying only references</p></div>
                <div class="content-body"><p><strong>What happens:</strong> Copies the object, but references point to the same nested objects.</p>
                <div class="code-block">Original: Person -> Address&lt;address1&gt;
Clone:    Person -> Address&lt;address1&gt;  // Same address object!</div>
                <p>If you modify the cloned object's address, the original is affected.</p></div>`
            },
            {
                id: 3,
                title: "Deep Clone",
                content: `<div class="content-header"><h2>3. Deep Clone</h2><p>Copying everything including nested objects</p></div>
                <div class="content-body"><p><strong>What happens:</strong> Creates independent copies of all objects, including nested ones.</p>
                <div class="code-block">Original: Person -> Address&lt;address1&gt;
Clone:    Person -> Address&lt;address2&gt;  // Different address object!</div></div>`
            },
            {
                id: 4,
                title: "Implementation",
                content: `<div class="content-header"><h2>4. Implementation</h2><p>How to implement cloning properly</p></div>
                <div class="content-body"><p><strong>Clone method:</strong></p>
                <div class="code-block">@Override
public Object clone() throws CloneNotSupportedException {
    // Shallow copy
    return super.clone();
}</div>
                <p><strong>For deep clone:</strong> Manually clone nested objects</p>
                <div class="code-block">@Override
public Object clone() throws CloneNotSupportedException {
    Person cloned = (Person) super.clone();
    cloned.address = (Address) this.address.clone(); // Deep copy
    return cloned;
}</div></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
