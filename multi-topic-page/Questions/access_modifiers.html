<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Access Modifiers - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.3em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul, .content-body table { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>🔐 Access Modifiers</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_keywords_index.html" class="back-link">← Back to Keywords</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "Public Access Modifier",
                content: `<div class="content-header"><h2>1. Public</h2><p>Maximum visibility</p></div>
                <div class="content-body"><p><strong>Accessible From:</strong></p><ul><li>Same class ✅</li><li>Same package ✅</li><li>Different package ✅</li><li>Subclass ✅</li></ul>
                <div class="code-block">public class MyClass { }
public void myMethod() { }</div>
                <p><strong>Use When:</strong> Member should be accessible everywhere</p></div>`
            },
            {
                id: 2,
                title: "Private Access Modifier",
                content: `<div class="content-header"><h2>2. Private</h2><p>Minimum visibility</p></div>
                <div class="content-body"><p><strong>Accessible From:</strong></p><ul><li>Same class ONLY ✅</li><li>Same package ❌</li><li>Different package ❌</li><li>Subclass ❌</li></ul>
                <div class="code-block">private String password;
private void processData() { }</div>
                <p><strong>Use When:</strong> Internal implementation details, encapsulation</p></div>`
            },
            {
                id: 3,
                title: "Protected Access Modifier",
                content: `<div class="content-header"><h2>3. Protected</h2><p>Package + Subclass visibility</p></div>
                <div class="content-body"><p><strong>Accessible From:</strong></p><ul><li>Same class ✅</li><li>Same package ✅</li><li>Different package (subclass only) ✅</li><li>Different package (non-subclass) ❌</li></ul>
                <div class="code-block">protected void helperMethod() { }</div>
                <p><strong>Use When:</strong> Want to allow subclasses in different packages to access</p></div>`
            },
            {
                id: 4,
                title: "Default (Package-Private)",
                content: `<div class="content-header"><h2>4. Default (No Modifier)</h2><p>Package-level visibility</p></div>
                <div class="content-body"><p><strong>Accessible From:</strong></p><ul><li>Same class ✅</li><li>Same package ✅</li><li>Different package ❌</li><li>Subclass (different package) ❌</li></ul>
                <div class="code-block">class MyClass { }  // Default - no modifier
void defaultMethod() { }</div>
                <p><strong>Use When:</strong></p><ul><li>Class only needed within package</li><li>Loose coupling within same package</li></ul></div>`
            },
            {
                id: 5,
                title: "Access Modifier Table",
                content: `<div class="content-header"><h2>5. Quick Reference Table</h2><p>Visibility summary</p></div>
                <div class="content-body"><table style="width: 100%; border-collapse: collapse; color: #d0d0d0;">
                <tr style="background: #0f1419;"><td style="border: 1px solid #2563eb; padding: 8px;"><strong>Modifier</strong></td><td style="border: 1px solid #2563eb; padding: 8px;"><strong>Same Class</strong></td><td style="border: 1px solid #2563eb; padding: 8px;"><strong>Package</strong></td><td style="border: 1px solid #2563eb; padding: 8px;"><strong>Subclass</strong></td><td style="border: 1px solid #2563eb; padding: 8px;"><strong>World</strong></td></tr>
                <tr><td style="border: 1px solid #2563eb; padding: 8px;">public</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td></tr>
                <tr><td style="border: 1px solid #2563eb; padding: 8px;">protected</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">❌</td></tr>
                <tr><td style="border: 1px solid #2563eb; padding: 8px;">default</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">❌</td><td style="border: 1px solid #2563eb; padding: 8px;">❌</td></tr>
                <tr><td style="border: 1px solid #2563eb; padding: 8px;">private</td><td style="border: 1px solid #2563eb; padding: 8px;">✅</td><td style="border: 1px solid #2563eb; padding: 8px;">❌</td><td style="border: 1px solid #2563eb; padding: 8px;">❌</td><td style="border: 1px solid #2563eb; padding: 8px;">❌</td></tr>
                </table></div>`
            },
            {
                id: 6,
                title: "Best Practices",
                content: `<div class="content-header"><h2>6. Best Practices</h2><p>Using access modifiers effectively</p></div>
                <div class="content-body"><p><strong>Encapsulation Principle:</strong> Start restrictive, open only as needed</p>
                <ul><li>Make everything private by default</li><li>Open to package (default) if needed</li><li>Use protected for inheritance hierarchies</li><li>Use public only for public API</li></ul>
                <div class="tip">The principle of least privilege: grant minimum necessary access.</div></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
