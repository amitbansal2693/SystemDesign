                            <li>Tables = connections, Customers = requests</li>
                        </ul>

                        <p style="margin-top: 15px;"><strong>🚕 Taxi Example:</strong></p>
                        <ul>
                            <li>City has 100 taxis (not 10,000)</li>
                            <li>1,000 people request rides</li>
                            <li>Each taxi takes a passenger and becomes available for the next one</li>
                            <li>Maintaining 10,000 taxis would be expensive and unnecessary</li>
                            <li>Similarly, 10,000 database connections would overload the database</li>
                        </ul>

                        <p style="margin-top: 15px;"><strong>🏦 Bank Counter Example:</strong></p>
                        <ul>
                            <li>Bank has 5 service counters</li>
                            <li>50 customers arrive</li>
                            <li>First 5 use counters, rest wait in queue</li>
                            <li>Counters = connections, reused for each customer</li>
                        </ul>

                        <h3 style="color: #2563eb; margin-top: 20px;">Why Do We Need Pools?</h3>
                        <p><strong>Problem 1: Creating resources repeatedly is expensive</strong></p>
                        <p>Creating a brand-new database connection for every request is expensive. Instead, create a limited number and reuse them.</p>

                        <p style="margin-top: 15px;"><strong>Problem 2: Limiting resource consumption</strong></p>
                        <p>Without pools, you could run out of resources (file descriptors, memory, database connections).</p>

                        <div class="tip" style="margin-top: 20px;">
                            <strong>📚 Library Analogy:</strong> A library has 100 books and 1,000 people want them. Rather than buying 1,000 books, the same 100 books are borrowed, returned, and reused by different people. This is exactly how connection pools work.
                        </div>
                    </div>
                `
            }
        ];

        // Populate sidebar
        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            item.id = `topic-${topic.id}`;
            topicsList.appendChild(item);
        });

        // Select topic
        function selectTopic(id, element) {
            // Remove active class from all items
            document.querySelectorAll('.topic-item').forEach(item => {
                item.classList.remove('active');
            });

            // Add active class to clicked item
            element.classList.add('active');

            // Show content
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
