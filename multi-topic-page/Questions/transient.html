<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Transient - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.4em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>🚫 Transient</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_keywords_index.html" class="back-link">← Back to Keywords</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "What is Transient?",
                content: `<div class="content-header"><h2>1. What is Transient?</h2><p>Mark variables to skip during serialization</p></div>
                <div class="content-body"><p><strong>Definition:</strong> Transient keyword tells serialization NOT to include the variable.</p>
                <div class="code-block">class User implements Serializable {
    String username;           // ✅ Serialized
    transient String password; // ❌ NOT serialized
}</div>
                <p><strong>Use Cases:</strong></p><ul><li>Sensitive data (passwords, tokens)</li><li>Temporary computation results</li><li>Database connections</li><li>Thread objects</li></ul></div>`
            },
            {
                id: 2,
                title: "Serialization Process",
                content: `<div class="content-header"><h2>2. Serialization Process</h2><p>How transient affects serialization</p></div>
                <div class="content-body"><p><strong>Normal Variable:</strong> Included in serialized object</p>
                <p><strong>Transient Variable:</strong> Skipped during serialization, gets default value on deserialization</p>
                <div class="code-block">// Before serialization
user.username = "john";     // "john"
user.password = "secret123"; // "secret123"

// After deserialization
user.username = "john";  // ✅ Restored
user.password = null;    // ❌ Lost (default for String)</div></div>`
            },
            {
                id: 3,
                title: "Real-World Example",
                content: `<div class="content-header"><h2>3. Real-World Example</h2><p>Security with transient variables</p></div>
                <div class="content-body"><div class="code-block">public class UserAccount implements Serializable {
    private String username;
    private String email;
    private transient String password;  // Never serialize
    private transient int otp;          // Temporary

    // Getters and setters
}</div>
                <div class="tip">Passwords and sensitive data should NEVER be serialized. Use transient to prevent accidental exposure.</div></div>`
            },
            {
                id: 4,
                title: "Default Values After Deserialization",
                content: `<div class="content-header"><h2>4. Default Values</h2><p>What transient variables become</p></div>
                <div class="content-body"><p><strong>After Deserialization, Transient Variables Get:</strong></p><ul><li>null (for objects)</li><li>0 (for numbers)</li><li>false (for boolean)</li><li>\\0 (for char)</li></ul>
                <p><strong>To Handle Default Values:</strong> Override readObject() method</p>
                <div class="code-block">private void readObject(ObjectInputStream ois)
    throws IOException, ClassNotFoundException {
    ois.defaultReadObject();
    // Initialize transient variables
    this.password = "";
}</div></div>`
            },
            {
                id: 5,
                title: "Transient with Collections",
                content: `<div class="content-header"><h2>5. Transient with Collections</h2><p>Handling collections with transient</p></div>
                <div class="content-body"><div class="code-block">class Configuration implements Serializable {
    String name;                    // Serialized
    transient List<String> tokens;  // NOT serialized
}</div>
                <p><strong>Purpose:</strong> Skip runtime caches, temporary lists, etc.</p></div>`
            },
            {
                id: 6,
                title: "Interview Key Points",
                content: `<div class="content-header"><h2>6. Interview Key Points</h2><p>Important facts about transient</p></div>
                <div class="content-body"><p><strong>Key Facts:</strong></p><ul><li>Used only with Serializable</li><li>Skips serialization of marked variables</li><li>Default values after deserialization</li><li>Cannot be used with static variables</li><li>Cannot be used with final variables (some limitations)</li><li>Applied during serialization process</li><li>No impact on normal program execution</li></ul>
                <p><strong>Best Practices:</strong></p><ul><li>Mark all sensitive data as transient</li><li>Override readObject() if needed to initialize</li><li>Use for temporary or cached data</li></ul></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
