            }

            background: #764ba2;
        }

</head>

    private State state = State.CLOSED;
    private int failureCount = 0;
    private long lastFailureTime = 0;
    private static final int THRESHOLD = 5;
    private static final long TIMEOUT = 60000; // 1 min

    public Object execute(Callable<Object> task) {

            if (System.currentTimeMillis() - lastFailureTime > TIMEOUT) {
                state = State.HALF_OPEN;
            } else {
                throw new CircuitBreakerOpenException();
            }
        }

        try {
            Object result = task.call();
            onSuccess();
            return result;
        } catch (Exception e) {

                        "Consistent hashing: Add virtual nodes to shift load gradually"
                    ],
                    "Rebalancing Strategies": [
                        "Downtime method: Pause writes, migrate, resume",
                        "Dual-write: New shard + old shard, eventually switch",
                        "Best: Use managed solution (Vitess, CockroachDB)"
                    ]
                }
            },
            {
                id: 20,
                title: "Observability: Metrics, Logs, Traces (3 Pillars)",
                category: "Observability",
                sections: {
                    "The 3 Pillars": [
                        "Metrics (Prometheus/Datadog): HTTP requests/sec, GC pause time",
                        "Logs (ELK/Splunk): Request ID, user_id, error stack trace",
                        "Traces (Jaeger/Zipkin): Request path across services"
                    ],
                    "Critical Correlation": [
                        "Trace ID = Unique per request",
                        "Span ID = Service execution",
                        "Metrics + Logs + Traces = Root cause in 5 minutes"
                    ],
                    "Spring Cloud Sleuth Setup": `// Spring Cloud Sleuth (auto-tracing)
@Autowired private Tracer tracer;

Span span = tracer.startSpan("database-query");
try {
    // Query
} finally {
    span.finish();
}
// Automatically appears in Jaeger UI`
                }
            }
        ];

        function renderQuestions(questions = questionsData) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${q.id}`;

                const categories = {
                    'Monitoring': '📊',
                    'Database': '🗄️',
                    'Performance Tuning': '⚙️',
                    'Caching': '💾',
                    'Database Architecture': '🏗️',
                    'Database Optimization': '🔍',
                    'Scalability': '📈',
                    'Load Balancing': '⚖️',
                    'Caching Patterns': '🎯',
                    'Microservices': '🔗',
                    'API Design': '🔌',
                    'Design Patterns': '🎨',
                    'High Availability': '🛡️',
                    'Real-world Scenarios': '🌍',
                    'Observability': '👁️'
                };

                const categoryIcon = categories[q.category] || '🔹';

                card.innerHTML = `
                    <div class="question-header" onclick="toggleCard(this.closest('.question-card'))">
                        <div class="question-number">${q.id}</div>
                        <div class="question-title">${q.title}</div>
                        <div class="toggle-icon">▼</div>
                    </div>
                    <div class="question-content">
                        <div style="margin-bottom: 15px;">
                            <span class="tag">${categoryIcon} ${q.category}</span>
                        </div>
                        ${generateSections(q.sections)}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function generateSections(sections) {
            let html = '';
            for (const [title, content] of Object.entries(sections)) {
                if (Array.isArray(content)) {
                    html += `
                        <div class="content-section">
                            <div class="section-title">${title}</div>
                            <div class="section-content">
                                <ul class="bullet-list">
                                    ${content.map(item => `<li>${item}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="content-section">
                            <div class="section-title">${title}</div>
                            <div class="section-content">
                                <div class="code-block">${escapeHtml(content)}</div>
                            </div>
                        </div>
                    `;
                }
            }
            return html;
        }

        function toggleCard(card) {
            card.classList.toggle('expanded');
        }

        function expandAll() {
            document.querySelectorAll('.question-card').forEach(card => {
                card.classList.add('expanded');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.question-card').forEach(card => {
                card.classList.remove('expanded');
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.question-card');

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(query)) {
                    card.style.display = 'block';
                    if (query.length > 0) {
                        card.classList.add('expanded');
                    }
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Add click handlers to section titles for collapsing
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('section-title')) {
                e.target.closest('.content-section').classList.toggle('collapsed');
            }
        });

        // Initial render
        renderQuestions();
    </script>
</body>
</html>
