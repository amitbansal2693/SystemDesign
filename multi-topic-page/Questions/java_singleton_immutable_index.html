<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singleton & Immutable Patterns - System Design</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; gap: 0; }
        .sidebar { width: 300px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.3em; color: #2563eb; text-shadow: 0 2px 10px rgba(37, 99, 235, 0.3); }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s ease; font-size: 0.95em; color: #a0a0a0; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; border-left-color: #2563eb; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; }
        .content-header { margin-bottom: 30px; border-bottom: 2px solid #2563eb; padding-bottom: 20px; }
        .content-header h2 { font-size: 2em; color: #2563eb; margin-bottom: 5px; }
        .content-header p { color: #90caf9; font-style: italic; }
        .content-body { flex: 1; line-height: 1.8; }
        .content-body p { margin-bottom: 15px; color: #d0d0d0; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; color: #90caf9; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
        .welcome-message { text-align: center; color: #a0a0a0; padding: 50px 20px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>👤 Singleton & Immutable</h1>
                <p style="font-size: 0.8em; color: #a0a0a0; margin-top: 5px;">3 Topics</p>
            </div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_master_index.html" class="back-link">← Back to Master Index</a>
            <div id="contentArea">
                <div class="welcome-message">
                    <p>👈 Click on a topic to explore</p>
                    <p style="font-size: 0.9em;">Master Singleton and Immutable design patterns</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const topics = [
            { title: "Bill Pugh Singleton", file: "bill_pugh_singleton.html" },
            { title: "Immutable Class", file: "immutable_class.html" },
            { title: "Singleton Issues", file: "singleton_issues.html" }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach((topic, index) => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => window.location.href = topic.file;
            topicsList.appendChild(item);
        });
    </script>
</body>
</html>
