<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Volatile - Complete Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI'; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0f1419; border-right: 1px solid #2563eb; overflow-y: auto; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 2px solid #2563eb; margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 1.4em; color: #2563eb; }
        .topic-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.3s; color: #a0a0a0; font-size: 0.9em; }
        .topic-item:hover { background: #1e293b; color: #2563eb; border-left-color: #2563eb; padding-left: 24px; }
        .topic-item.active { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        .content-area { flex: 1; background: #1a1a2e; overflow-y: auto; padding: 30px; }
        .content-header h2 { font-size: 1.8em; color: #2563eb; margin-bottom: 10px; }
        .content-header p { color: #90caf9; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #2563eb; padding-bottom: 15px; }
        .content-body p { margin-bottom: 15px; line-height: 1.8; }
        .content-body ul { margin-left: 30px; margin-bottom: 15px; }
        .content-body li { margin-bottom: 8px; }
        .content-body strong { color: #2563eb; }
        .code-block { background: #0f1419; padding: 15px; border-radius: 6px; border-left: 3px solid #2563eb; color: #90caf9; font-family: 'Courier New'; font-size: 0.85em; margin: 15px 0; overflow-x: auto; }
        .tip { background: #1e3a5f; border-left: 4px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>⚡ Volatile</h1></div>
            <div id="topicsList"></div>
        </div>
        <div class="content-area">
            <a href="java_keywords_index.html" class="back-link">← Back to Keywords</a>
            <div id="contentArea" style="text-align:center; color: #a0a0a0; padding: 50px;">Click on a topic →</div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1,
                title: "What is Volatile?",
                content: `<div class="content-header"><h2>1. What is Volatile?</h2><p>Ensuring visibility in multithreaded environments</p></div>
                <div class="content-body"><p><strong>Definition:</strong> Volatile keyword tells JVM to always read/write from main memory, never from cache.</p>
                <div class="code-block">volatile boolean running = true;
volatile int counter = 0;</div>
                <p><strong>Problem Without Volatile:</strong></p><ul><li>Threads cache variable values</li><li>One thread's change not visible to others</li><li>Can cause data inconsistency</li></ul>
                <div class="tip">Volatile guarantees memory visibility but NOT atomicity.</div></div>`
            },
            {
                id: 2,
                title: "Memory Visibility",
                content: `<div class="content-header"><h2>2. Memory Visibility</h2><p>How volatile affects memory operations</p></div>
                <div class="content-body"><p><strong>Without Volatile (Cache Issues):</strong></p>
                <div class="code-block">Thread 1 reads x from cache: 10
Thread 2 updates x to 20 in memory
Thread 1 still sees x = 10 (cached)</div>
                <p><strong>With Volatile (Main Memory):</strong></p>
                <div class="code-block">Thread 1 reads x from main memory: 10
Thread 2 updates x in main memory: 20
Thread 1 re-reads x from main memory: 20 ✅</div>
                <p><strong>Memory Barriers:</strong> Volatile operations create memory barriers to enforce ordering</p></div>`
            },
            {
                id: 3,
                title: "Volatile vs Synchronized",
                content: `<div class="content-header"><h2>3. Volatile vs Synchronized</h2><p>When to use which</p></div>
                <div class="content-body"><p><strong>Volatile:</strong></p><ul><li>Ensures visibility, NOT atomicity</li><li>Lower overhead</li><li>For single variable reads/writes</li><li>Non-blocking</li></ul>
                <p><strong>Synchronized:</strong></p><ul><li>Ensures visibility AND atomicity</li><li>Higher overhead (lock acquisition)</li><li>For critical sections</li><li>Blocking (acquires lock)</li></ul>
                <p><strong>Use Volatile When:</strong> Simple read/write of single variables</p>
                <p><strong>Use Synchronized When:</strong> Multiple related operations</p></div>`
            },
            {
                id: 4,
                title: "Real-World Example",
                content: `<div class="content-header"><h2>4. Real-World Example</h2><p>Flag pattern commonly used</p></div>
                <div class="content-body"><p><strong>Example: Thread control with flag</strong></p>
                <div class="code-block">class ThreadControl {
    private volatile boolean running = true;

    public void startThread() {
        Thread t = new Thread(() -> {
            while (running) {  // See updates immediately
                doWork();
            }
        });
        t.start();
    }

    public void stopThread() {
        running = false;  // Visible to worker thread
    }
}</div>
                <div class="tip">Without volatile, worker thread might not see the updated running flag and keep looping.</div></div>`
            },
            {
                id: 5,
                title: "Limitations & Important Facts",
                content: `<div class="content-header"><h2>5. Limitations & Important Facts</h2><p>What volatile cannot guarantee</p></div>
                <div class="content-body"><p><strong>Limitations:</strong></p><ul><li>Does NOT guarantee atomicity</li><li>Cannot use for compound operations</li><li>Reading then modifying still has race conditions</li></ul>
                <p><strong>Example of Atomicity Issue:</strong></p>
                <div class="code-block">volatile int counter;

// ❌ NOT atomic! Read-modify-write is 3 operations
counter++;

// Two threads both see 0, both increment to 1, lose update!</div>
                <p><strong>Solution for Atomicity:</strong> Use AtomicInteger</p>
                <div class="code-block">AtomicInteger counter = new AtomicInteger(0);
counter.incrementAndGet();  // ✅ Atomic</div></div>`
            },
            {
                id: 6,
                title: "Interview Key Points",
                content: `<div class="content-header"><h2>6. Interview Key Points</h2><p>Important facts about volatile</p></div>
                <div class="content-body"><p><strong>Key Facts:</strong></p><ul><li>Guarantees memory visibility, NOT atomicity</li><li>Always reads/writes from main memory</li><li>Lower overhead than synchronized</li><li>Use for single variable flags</li><li>Cannot use volatile with local variables</li><li>Works with primitive types and objects</li><li>Orders memory operations correctly</li><li>Does not prevent reading stale values in compound operations</li></ul>
                <p><strong>When to Choose:</strong></p><ul><li>Volatile = simple reads/writes</li><li>Synchronized = atomicity needed</li><li>AtomicInteger = compound operations</li></ul></div>`
            }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            topicsList.appendChild(item);
        });

        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
