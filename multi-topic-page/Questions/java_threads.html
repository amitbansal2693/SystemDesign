                <p><strong>If Interviewer Asks: "What is a thread in Java?"</strong></p>
                <p><strong>Answer:</strong></p>
                <p>A thread is an independent unit of execution within a Java process. Multiple threads allow an application to execute multiple tasks concurrently. Each thread has its own stack and execution state, while threads within the same process can share objects in the heap. Because shared mutable data can lead to race conditions, synchronization or other concurrency mechanisms may be required. In production applications, thread pools are commonly used to manage and reuse a limited number of worker threads instead of creating a new thread for every task.</p></div>`
