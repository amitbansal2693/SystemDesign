<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 8 Features - System Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        /* ── LEFT SIDEBAR ── */
        .sidebar {
            width: 300px;
            background: #0f1419;
            border-right: 1px solid #2563eb;
            overflow-y: auto;
            padding: 20px 0;
        }

        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 2px solid #2563eb;
            margin-bottom: 20px;
        }

        .sidebar-header h1 {
            font-size: 1.3em;
            color: #2563eb;
            text-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
        }

        .topic-item {
            padding: 12px 20px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
            font-size: 0.95em;
            color: #a0a0a0;
        }

        .topic-item:hover {
            background: #1e293b;
            color: #2563eb;
            border-left-color: #2563eb;
            padding-left: 24px;
        }

        .topic-item.active {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            border-left-color: #2563eb;
        }

        /* ── MAIN CONTENT ── */
        .content-area {
            flex: 1;
            background: #1a1a2e;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            margin-bottom: 30px;
            border-bottom: 2px solid #2563eb;
            padding-bottom: 20px;
        }

        .content-header h2 {
            font-size: 2em;
            color: #2563eb;
            margin-bottom: 5px;
        }

        .content-header p {
            color: #90caf9;
            font-style: italic;
        }

        .content-body {
            flex: 1;
            line-height: 1.8;
        }

        .content-body p {
            margin-bottom: 15px;
            color: #d0d0d0;
        }

        .content-body pre {
            background: #0f1419;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
            border-left: 3px solid #2563eb;
            color: #90caf9;
            font-size: 0.9em;
        }

        .content-body ul, .content-body ol {
            margin-left: 30px;
            margin-bottom: 15px;
        }

        .content-body li {
            margin-bottom: 8px;
            color: #d0d0d0;
        }

        .content-body strong {
            color: #2563eb;
        }

        .tip {
            background: #1e3a5f;
            border-left: 4px solid #2563eb;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
            color: #90caf9;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f1419;
        }

        ::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #1e40af;
        }

        .welcome-message {
            text-align: center;
            color: #a0a0a0;
            padding: 50px 20px;
        }

        .welcome-message p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .back-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>☕ Java 8</h1>
                <p style="font-size: 0.8em; color: #a0a0a0; margin-top: 5px;">10 Topics</p>
            </div>
            <div id="topicsList"></div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="content-area">
            <a href="java_master_index.html" class="back-link">← Back to Master Index</a>
            <div id="contentArea">
                <div class="welcome-message">
                    <p>👈 Click on a topic to begin</p>
                    <p style="font-size: 0.9em;">Explore Java 8 features and modern Java development</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const topics = [
            { title: "Lambda Expressions", file: "lambda.html" },
            { title: "Functional Interfaces", file: "functional_interface.html" },
            { title: "Stream API", file: "stream.html" },
            { title: "Collectors", file: "stream.html" },  // Collector details in Stream page
            { title: "Parallel Streams", file: "stream.html" },  // Parallel details in Stream page
            { title: "Predicate", file: "functional_interface.html" },  // Predicate in Functional Interface
            { title: "Primitive to Integer Conversion", file: "stream.html" },  // Conversion in Stream page
            { title: "groupBy", file: "stream.html" },
            { title: "partitioningBy", file: "stream.html" },
            { title: "Reduce", file: "stream.html" }
        ];

        const topicsList = document.getElementById('topicsList');
        topics.forEach((topic, index) => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => window.location.href = topic.file;
            topicsList.appendChild(item);
        });
            },
            {
                id: 8,
                title: "GroupBy Operations",
                content: `
                    <div class="content-header">
                        <h2>GroupBy Operations</h2>
                        <p>Grouping stream data</p>
                    </div>
                    <div class="content-body">
                        <p><strong>Status:</strong> Coming Soon - Guide to groupBy collector</p>
                    </div>
                `
            },
            {
                id: 9,
                title: "PartitioningBy Operations",
                content: `
                    <div class="content-header">
                        <h2>PartitioningBy Operations</h2>
                        <p>Binary partitioning of streams</p>
                    </div>
                    <div class="content-body">
                        <p><strong>Status:</strong> Coming Soon - Guide to partitioningBy collector</p>
                    </div>
                `
            },
            {
                id: 10,
                title: "Reduce Operations",
                content: `
                    <div class="content-header">
                        <h2>Reduce Operations</h2>
                        <p>Aggregating stream elements</p>
                    </div>
                    <div class="content-body">
                        <p><strong>Status:</strong> Coming Soon - Guide to reduce terminal operation</p>
                    </div>
                `
            }
        ];

        // Populate sidebar
        const topicsList = document.getElementById('topicsList');
        topics.forEach(topic => {
            const item = document.createElement('div');
            item.className = 'topic-item';
            item.textContent = topic.title;
            item.onclick = () => selectTopic(topic.id, item);
            item.id = `topic-${topic.id}`;
            topicsList.appendChild(item);
        });

        // Select topic
        function selectTopic(id, element) {
            document.querySelectorAll('.topic-item').forEach(item => {
                item.classList.remove('active');
            });

            element.classList.add('active');

            const topic = topics.find(t => t.id === id);
            document.getElementById('contentArea').innerHTML = topic.content;
        }
    </script>
</body>
</html>
